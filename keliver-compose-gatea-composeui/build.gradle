// Gate A prototype: the host renderers. src/commonMain/…/Generated.kt is generated (each renderer calls the
// real Compose function); Runtime.kt (children, converters) and Extras.kt (the shimmer) are hand-written.
import dev.keliver.buildsupport.WasmJs
import static dev.keliver.buildsupport.TargetGroup.ToolkitComposeUi

redwoodBuild {
  // wasmJs: the editor canvas draws with these renderers in the browser (ED0 spike, docs/ED0_SPIKE.md).
  targets(ToolkitComposeUi + WasmJs.Browser)
  // Prototype only (no API dump, no explicitApi history): local Maven at most. NEVER pass
  // -PkeliverComposePrototype to the Central publish workflow (publish-maven-central.yml).
  if (rootProject.hasProperty('keliverComposePrototype')) publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverComposeGateaWidget
        api projects.keliverMaterialComposeui
        implementation projects.keliverWidgetComposeui
        implementation libs.jetbrains.compose.foundation
        // Gate B-e: animated references and AnimatedVisibility call the real animation API.
        implementation libs.jetbrains.compose.animation
        implementation libs.jetbrains.compose.material3
        implementation libs.jetbrains.compose.material.icons.core
        implementation libs.jetbrains.compose.material.icons.extended
        implementation libs.coil.compose.full
        implementation libs.jetbrains.compose.ui
      }
    }
    // The same-source samples, harness and pixel tests (SameSourceTest), shared by the JVM and the
    // iOS simulator (Gate B part c). Not commonTest: Android unit tests and JS/wasm would compile them.
    sameSourceTest {
      dependsOn commonTest
      dependencies {
        implementation libs.kotlin.test
        implementation libs.kotlinx.coroutines.test
        implementation libs.jetbrains.compose.ui.test
        implementation libs.jetbrains.compose.foundation
        implementation libs.jetbrains.compose.material3
        implementation libs.jetbrains.compose.material.icons.core
        implementation libs.jetbrains.compose.material.icons.extended
        implementation libs.coil.compose.full
        implementation projects.keliverComposeGateaCompose
        implementation projects.keliverComposeGateaProtocolGuest
        implementation projects.keliverComposeGateaProtocolHost
        implementation projects.keliverProtocolGuest
        implementation projects.keliverProtocolHost
        implementation projects.keliverCompose
        implementation projects.keliverLeakDetector
        implementation projects.keliverLayoutComposeui
        implementation projects.keliverLazylayoutComposeui
      }
    }
    iosTest {
      dependsOn sameSourceTest
    }
    jvmTest {
      dependsOn sameSourceTest
      dependencies {
        implementation libs.kotlin.test
        implementation libs.kotlinx.coroutines.test
        implementation libs.jetbrains.compose.ui.test
        implementation rootProject.ext.skikoHostRuntime()
        implementation projects.keliverComposeGateaCompose
        implementation projects.keliverComposeGateaProtocolGuest
        implementation projects.keliverComposeGateaProtocolHost
        implementation projects.keliverProtocolGuest
        implementation projects.keliverProtocolHost
        implementation projects.keliverCompose
        implementation projects.keliverLeakDetector
        implementation projects.keliverLayoutComposeui
        implementation projects.keliverLazylayoutComposeui
      }
    }
  }
}

android {
  namespace 'dev.keliver.compose.gatea.composeui'
}

// The iOS same-source run writes its captures (native, guest, diff) beside the JVM ones. simctl
// passes SIMCTL_CHILD_* variables to the test process without the prefix.
// -Pkeliver.iosTestDevice=<udid> runs on that (shut down) simulator instead of Kotlin's default
// device: scripts/keliver-gateb-ios-sim.sh passes the one it created.
def iosTestDevice = providers.gradleProperty('keliver.iosTestDevice')
tasks.withType(org.jetbrains.kotlin.gradle.targets.native.tasks.KotlinNativeSimulatorTest).configureEach {
  def out = layout.buildDirectory.dir("gate-ios/${name}").get().asFile
  environment('SIMCTL_CHILD_GATE_IOS_ARTIFACTS', out.absolutePath)
  if (iosTestDevice.present) device.set(iosTestDevice.get())
  doFirst { out.mkdirs() }
}

// The generator writes Generated.kt and the staleness guard compares it byte for byte: no spotless.
afterEvaluate {
  spotless {
    kotlin {
      targetExclude("src/**/Generated.kt")
    }
  }
}
