// spike/keliver-web portal P5 — the iOS Treehouse HOST framework (peer of
// portal-device-android). Same two modes: dev (interpreter guest polling the
// portal-server draft) and prod (compiled, Ed25519-signed published bundle).
// The Xcode shell (portal-device-ios-app/) embeds this via
// `:portal-device-ios:embedAndSignAppleFrameworkForXcode`.
apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.compose'
apply plugin: 'app.cash.zipline' // IR plugin: rewrites the host's zipline.take/bind

// P4/P5: embed the portal's Ed25519 PUBLIC key as a generated Kotlin const so
// prod mode can verify signed manifests (parity with the Android host's asset).
//
// A PROVIDER, not a value: resolving while this file is read made every task in
// the build depend on an identity most of them never use. Queried only when
// generatePortalKey is in the graph, i.e. when an iOS framework is compiled.
//
// THE DIRECTORY IS THIS TASK'S, AND HOLDS EXACTLY ONE FILE (#77). It is an
// iosMain source directory, so ANYTHING in it is compiled into the framework —
// and output-directory contents are not part of Gradle's up-to-date check.
// MEASURED: a Planted.kt dropped beside PortalPublicKey.kt survived an
// UP-TO-DATE run of this task, was compiled into the module klib, and a public
// function in it was exported from a linked debug simulator framework
// (docs/superpowers/evidence/issue-77/). The Android host's syncPortalKey had
// the same shape and is fixed the same way: the task empties the directory in
// its own action and runs every time, which costs one small write. Rewriting
// identical bytes does not dirty the compile, whose inputs are content hashes.
def portalPubKey = providers.provider { new File(keliverPortalStore(project), 'keys/ed25519.pub') }
def portalKeyDir = file("$buildDir/generated/portalKeys/kotlin")
def generatePortalKey = tasks.register('generatePortalKey') {
  inputs.property('exists', providers.provider { portalPubKey.get().exists() })
  inputs.files(providers.provider { portalPubKey.get().exists() ? [portalPubKey.get()] : [] })
  outputs.dir(portalKeyDir)
  outputs.upToDateWhen { false }
  doLast {
    def keyFile = portalPubKey.get()
    def hex = keyFile.exists() ? keyFile.text.trim() : ''
    portalKeyDir.deleteDir()
    portalKeyDir.mkdirs()
    new File(portalKeyDir, 'PortalPublicKey.kt').text = "package dev.keliver.portaldevice.ios\n\n// GENERATED from the portal store's ed25519.pub — do not edit.\ninternal const val PORTAL_PUBLIC_KEY_HEX: String = \"$hex\"\n"
  }
}
tasks.configureEach { t ->
  if (t.name.startsWith('compileKotlinIos')) t.dependsOn(generatePortalKey)
}

kotlin {
  [iosArm64(), iosSimulatorArm64()].each { iosTarget ->
    iosTarget.binaries.framework {
      baseName = 'PortalDeviceHost'
      isStatic = true
      binaryOption('bundleId', 'dev.keliver.portaldevice.ios')
      // Zipline's SQLite-backed bundle cache.
      linkerOpts.add('-lsqlite3')
    }
  }

  sourceSets {
    iosMain {
      kotlin.srcDir(portalKeyDir)
      dependencies {
        implementation projects.keliverTreehouseHost
        implementation projects.keliverTreehouseHostComposeui
        implementation projects.keliverMaterialComposeui
        implementation projects.keliverMaterialProtocolHostWeb      // KeliverMaterialHostProtocol
        implementation projects.portalDeviceGuest          // HostApi / PortalPresenter interfaces
        implementation projects.portalSql                  // M7/M9: HostSqlDriver wire (IosSqlHost)
        implementation projects.keliverHttp                // #16 H1: generic HostHttpProvider
        implementation projects.keliverLeakDetector
        implementation libs.zipline
        implementation libs.zipline.loader
        implementation libs.jetbrains.compose.runtime
        implementation libs.jetbrains.compose.foundation
        implementation libs.jetbrains.compose.ui
        implementation libs.coil.compose
        implementation libs.kotlinx.coroutines.core
        implementation libs.okio
      }
    }
  }
}
