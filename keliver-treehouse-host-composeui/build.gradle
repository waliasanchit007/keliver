import static dev.keliver.buildsupport.TargetGroup.TreehouseHost

redwoodBuild {
  targets(TreehouseHost)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// NF5 H0: the production host templates' line files (scripts/templates/production-host/src/line-*/:
// KeliverLine.kt and the host features the line declares, HostFeatures.kt) for the line this
// checkout's libraries are on, compiled into the JVM tests against those libraries. So a template
// change that does not compile against this TreehouseContent or TreehouseApp.Spec fails here, and
// HostTemplateLineTest runs the templates' own hidden-content call. (The 0.4 line's copies build
// against the published 0.4.x libraries, in the reference-app and ios-host workflows.)
def hostTemplateLineSource = tasks.register('hostTemplateLineSource', Copy) {
  from(rootProject.file('scripts/templates/production-host/src/line-0.5/kotlin/KeliverLine.kt'))
  from(rootProject.file('scripts/templates/production-host/src/line-0.5/kotlin/HostFeatures.kt'))
  filter { line -> line.replace('@@PACKAGE@@', 'hosttemplate') }
  into layout.buildDirectory.dir('generated/hostTemplateLine/kotlin')
}

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverTreehouse
        api projects.keliverTreehouseHost
        implementation libs.jetbrains.compose.foundation
        implementation projects.keliverComposeui
        implementation projects.keliverWidgetComposeui
      }
    }
    androidMain {
      dependencies {
        implementation libs.androidx.activity.compose
      }
    }
    // TreehouseContent's back gate (NF5 H0), with Compose UI headless on the desktop JVM.
    jvmTest {
      kotlin.srcDir(hostTemplateLineSource)
      dependencies {
        implementation libs.kotlin.test
        implementation libs.assertk
        implementation libs.jetbrains.compose.ui.test
        implementation rootProject.ext.skikoHostRuntime()
      }
    }
  }
}

android {
  namespace 'app.cash.treehouse.composeui'
}
