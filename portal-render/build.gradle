// spike/keliver-web portal P1 — the GENERATED WidgetNode→keliver-material
// interpreter, shared by the web preview (wasmJs) and the device dev-guest (js).
// GeneratedRenderNode.kt is produced by :portal-schema-codegen:generatePortalCode.
apply plugin: 'org.jetbrains.kotlin.multiplatform'

// Published: the generated RenderNode interpreter + preview contracts.
redwoodBuild {
  publishing()
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.compose'

kotlin {
  js { browser() }
  wasmJs { browser() }
  sourceSets {
    commonMain {
      dependencies {
        api projects.portalCore
        api projects.keliverMaterialCompose
        api projects.keliverLayoutCompose
        implementation libs.jetbrains.compose.runtime
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
      }
    }
    // K1 parity gate lives on wasmJs ONLY: that is the target the editor
    // actually runs, and kotlinx-coroutines-test currently crashes the
    // Kotlin/JS IR backend (ExternalPropertyOverridingLowering) when pulled
    // into the js test compilation.
    wasmJsTest {
      dependencies {
        implementation projects.keliverMaterialTesting
        implementation libs.kotlinx.coroutines.test
      }
    }
  }
}
