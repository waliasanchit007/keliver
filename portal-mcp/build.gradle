// V2 M2 — the agent-native surface: a stdio JSON-RPC MCP server fronting the
// portal-server op engine (:8077). Agents get catalog-grounded, transactional,
// dry-runnable screen authoring. See design §6.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'application'

application {
  mainClass = 'dev.keliver.portal.mcp.MainKt'
}

dependencies {
  implementation projects.portalCore      // generated catalog for get_catalog
  implementation projects.portalDocument  // op/document types
  implementation libs.kotlinx.serialization.json

  testImplementation libs.kotlin.test
  testImplementation libs.kotlin.test.junit
  testImplementation libs.junit
}

tasks.named('test') { useJUnit() }

// Ship the usage guide INSIDE the package. get_guide used to read
// <PORTAL_REPO>/docs/PORTAL_USAGE.md, a path that only exists in this
// repository, so the tool worked for us and returned "guide not found" for
// every adopter. Copied at build time rather than duplicated in the source
// tree, so it cannot drift from docs/PORTAL_USAGE.md.
def bundleGuide = tasks.register('bundlePortalGuide', Copy) {
  from(rootProject.file('docs/PORTAL_USAGE.md'))
  into(layout.buildDirectory.dir('generated/guide/dev/keliver/portal/mcp'))
}
sourceSets.main.resources.srcDir(bundleGuide.map { it.destinationDir.parentFile.parentFile.parentFile.parentFile })
tasks.named('processResources') { dependsOn(bundleGuide) }
