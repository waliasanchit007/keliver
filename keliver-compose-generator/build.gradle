// Gate A prototype (docs/COMPOSE_GENERATOR_DESIGN.md): reads Compose's published API (Kotlin metadata
// of the CMP desktop jars) and sources (their -sources.jar) and writes the checked-in sources of the
// generated group: a Redwood schema, the guest stubs in dev.keliver.compose.*, the host renderers,
// the lock file and editor metadata. Not published.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

dependencies {
  implementation libs.kotlin.compilerEmbeddable // PSI for default expressions, and its shaded ASM
  implementation "org.jetbrains.kotlin:kotlin-metadata-jvm:${libs.versions.kotlin.get()}"
  implementation libs.kotlinx.serialization.json
  testImplementation libs.junit
  testImplementation libs.kotlin.test.junit
}

// The generator reads exactly the Compose the generated renderers compile against: each input is the
// desktop (JVM) artifact of a catalog alias the composeui module depends on, at that alias's version
// (jbCompose for foundation and ui; material3's own pin, which CMP versions separately; coil). There is
// no separate generator pin: bumping jbCompose moves the generator's input with it, and the staleness
// guard (checkComposeApi) then fails until the group is regenerated, with the lock appended to only.
def desktopOf = { alias, String artifact = null, String platform = 'desktop' ->
  def d = alias.get()
  "${d.module.group}:${artifact ?: d.module.name}-${platform}:${d.versionConstraint.requiredVersion}"
}
def composeInputs = [
  desktopOf(libs.jetbrains.compose.foundation, 'foundation-layout'),
  desktopOf(libs.jetbrains.compose.foundation),
  desktopOf(libs.jetbrains.compose.material3),
  desktopOf(libs.jetbrains.compose.ui.asProvider()),
  desktopOf(libs.jetbrains.compose.ui.asProvider(), 'ui-graphics'),
  desktopOf(libs.coil.compose.full, null, 'jvm'),
  desktopOf(libs.coil.compose.asProvider(), null, 'jvm'),
]

// The Compose API the generator reads: desktop JVM jars (metadata) and their sources.
configurations {
  composeApi {
    canBeConsumed = false
    attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
  }
  composeSources { canBeConsumed = false; transitive = false }
}
dependencies {
  composeInputs.each {
    composeApi it
    composeSources "$it:sources@jar"
  }
}

// Recorded in the generated files' header, so a regeneration's diff names the Compose it read.
def composeInputVersions = "Compose Multiplatform ${libs.versions.jbCompose.get()}, material3 ${libs.jetbrains.compose.material3.get().versionConstraint.requiredVersion}, coil ${libs.versions.coil.get()}"

def generatorArgs = { List extra ->
  [
    '--config', file('gatea.json').absolutePath,
    '--lock', file('gatea.lock.json').absolutePath,
    '--classpath', configurations.composeApi.asPath,
    '--sources', configurations.composeSources.asPath,
    '--out-schema', rootProject.file('keliver-compose-gatea-schema/src/main/kotlin').absolutePath,
    '--out-guest', rootProject.file('keliver-compose-gatea-compose/src/commonMain/kotlin').absolutePath,
    '--out-host', rootProject.file('keliver-compose-gatea-composeui/src/commonMain/kotlin').absolutePath,
    '--out-values', rootProject.file('keliver-compose-values/src/commonMain/kotlin').absolutePath,
    '--out-editor', rootProject.file('keliver-compose-gatea-schema/gatea.editor.json').absolutePath,
    '--input', composeInputVersions,
  ] + extra
}

tasks.register('generateComposeApi', JavaExec) {
  group = 'build'
  description = 'Regenerate the Gate A group (schema, guest stubs, host renderers, lock, editor metadata) from Compose'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dev.keliver.compose.generator.MainKt'
  args = generatorArgs([])
}

tasks.register('checkComposeApi', JavaExec) {
  group = 'verification'
  description = 'Fails when the checked-in generated sources or lock differ from a fresh generation, or the lock changed other than by appends'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dev.keliver.compose.generator.MainKt'
  args = generatorArgs(['--check'])
}
