// The Compose generator (docs/COMPOSE_GENERATOR_DESIGN.md): reads Compose's published API (Kotlin
// metadata of the CMP desktop jars) and sources (their -sources.jar) and writes the checked-in sources
// of each generated group (one config and one lock per group): a Redwood schema, the guest stubs in
// dev.keliver.compose.*, the host renderers, the lock file and editor metadata; and the product's
// root schema, which lists the groups (root.json). Not published (MS4-11 decides, Q8 and Q15).
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

dependencies {
  implementation libs.kotlin.compilerEmbeddable // PSI for default expressions, and its shaded ASM
  implementation "org.jetbrains.kotlin:kotlin-metadata-jvm:${libs.versions.kotlin.get()}"
  implementation libs.kotlinx.serialization.json
  testImplementation libs.junit
  testImplementation libs.kotlin.test.junit
}

// The generator reads exactly the Compose the generated renderers compile against: each input is the
// desktop (JVM) artifact of a catalog alias the composeui module depends on, at that alias's version
// (jbCompose for foundation and ui; material3's own pin, which CMP versions separately; coil). There is
// no separate generator pin: bumping jbCompose moves the generator's input with it, and the staleness
// guard (checkComposeApi) then fails until the group is regenerated, with the lock appended to only.
def desktopOf = { alias, String artifact = null, String platform = 'desktop' ->
  def d = alias.get()
  "${d.module.group}:${artifact ?: d.module.name}-${platform}:${d.versionConstraint.requiredVersion}"
}
def composeInputs = [
  desktopOf(libs.jetbrains.compose.foundation, 'foundation-layout'),
  desktopOf(libs.jetbrains.compose.foundation),
  desktopOf(libs.jetbrains.compose.animation),
  desktopOf(libs.jetbrains.compose.animation, 'animation-core'),
  desktopOf(libs.jetbrains.compose.material3),
  desktopOf(libs.jetbrains.compose.ui.asProvider()),
  desktopOf(libs.jetbrains.compose.ui.asProvider(), 'ui-graphics'),
  desktopOf(libs.coil.compose.full, null, 'jvm'),
  desktopOf(libs.coil.compose.asProvider(), null, 'jvm'),
]

// The Compose API the generator reads: desktop JVM jars (metadata) and their sources.
configurations {
  composeApi {
    canBeConsumed = false
    attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
  }
  composeSources { canBeConsumed = false; transitive = false }
}
dependencies {
  composeInputs.each {
    composeApi it
    composeSources "$it:sources@jar"
  }
  // GenericEmit's call records read TextStyle's default expressions from ui-text's sources (from #312).
  // Sources only: the API inputs, and so every generated group, are unchanged.
  composeSources "${desktopOf(libs.jetbrains.compose.ui.asProvider(), 'ui-text')}:sources@jar"
}

// Recorded in the generated files' header, so a regeneration's diff names the Compose it read.
def composeInputVersions = "Compose Multiplatform ${libs.versions.jbCompose.get()}, material3 ${libs.jetbrains.compose.material3.get().versionConstraint.requiredVersion}, coil ${libs.versions.coil.get()}"

// The generated groups, one config and one lock each (docs/MS4_PLAN.md, MS4-01), in generation order.
// - `core` is the product's group (Q1: foundation-layout, foundation, ui, material3, animation and the
//   extras; the icons stay in it until their own groups, MS4-19). It owns keliver-compose-values and
//   the `*Defaults` factory tags, and shares its host runtime with `coil` (`sharedRuntime`). Its lock
//   started from the prototype's (`--seed-lock`, read only while core.lock.json does not exist) until
//   MS4-06's fresh locks; it keeps the two AsyncImage entries coil took (tags 8 and 11, now unused).
// - `coil` (MS4-03; Q1: optional) is `AsyncImage` alone, on core's host runtime (`base`), so a host
//   built without keliver-compose-coil-composeui links no Coil. It reads core's factory tags and
//   writes no values. Its lock is its own, from level 1.
// - `gatea` is the Gate A/B prototype, kept beside the product for NF5's measurements until MS4-40.
//   It reads the factory tags from core's lock and writes no values.
def groups = [
  [
    name: 'core',
    args: [
      '--seed-lock', file('gatea.lock.json').absolutePath,
      '--out-schema', rootProject.file('keliver-compose-core-schema/src/main/kotlin').absolutePath,
      '--out-guest', rootProject.file('keliver-compose-core-compose/src/commonMain/kotlin').absolutePath,
      '--out-host', rootProject.file('keliver-compose-core-composeui/src/commonMain/kotlin').absolutePath,
      '--out-values', rootProject.file('keliver-compose-values/src/commonMain/kotlin').absolutePath,
      '--out-editor', rootProject.file('keliver-compose-core-schema/core.editor.json').absolutePath,
    ],
  ],
  [
    name: 'coil',
    args: [
      '--factories-lock', file('core.lock.json').absolutePath,
      '--out-schema', rootProject.file('keliver-compose-coil-schema/src/main/kotlin').absolutePath,
      '--out-guest', rootProject.file('keliver-compose-coil-compose/src/commonMain/kotlin').absolutePath,
      '--out-host', rootProject.file('keliver-compose-coil-composeui/src/commonMain/kotlin').absolutePath,
      '--out-editor', rootProject.file('keliver-compose-coil-schema/coil.editor.json').absolutePath,
    ],
  ],
  [
    name: 'gatea',
    args: [
      '--factories-lock', file('core.lock.json').absolutePath,
      '--out-schema', rootProject.file('keliver-compose-gatea-schema/src/main/kotlin').absolutePath,
      '--out-guest', rootProject.file('keliver-compose-gatea-compose/src/commonMain/kotlin').absolutePath,
      '--out-host', rootProject.file('keliver-compose-gatea-composeui/src/commonMain/kotlin').absolutePath,
      '--out-editor', rootProject.file('keliver-compose-gatea-schema/gatea.editor.json').absolutePath,
      // ED0 spike (docs/ED0_SPIKE.md): the editor canvas's interpreter from a document node to the stubs.
      '--out-editor-render', rootProject.file('portal-compose-render/src/commonMain/kotlin').absolutePath,
    ],
  ],
]

def generatorArgs = { Map group, List extra ->
  [
    '--config', file("${group.name}.json").absolutePath,
    '--lock', file("${group.name}.lock.json").absolutePath,
    '--classpath', configurations.composeApi.asPath,
    '--sources', configurations.composeSources.asPath,
    '--input', composeInputVersions,
  ] + group.args + extra
}

// The root schema lists the product groups (root.json); it needs no Compose input.
def rootArgs = { List extra ->
  ['--root', file('root.json').absolutePath, '--out-schema', rootProject.file('keliver-compose-root-schema/src/main/kotlin').absolutePath] + extra
}

// The editor canvas's interpreter (MS4-41, G0): each group that passes --out-editor-render writes its
// own GeneratedEditorRender_<Group>.kt; one generated dispatcher (Generated.kt) lists those groups.
def editorRenderDir = rootProject.file('portal-compose-render/src/commonMain/kotlin').absolutePath
def editorRenderGroups = groups.findAll { it.args.contains('--out-editor-render') }.collect { it.name }
def editorRenderArgs = { List extra ->
  ['--editor-dispatcher', editorRenderGroups.join(','), '--out-editor-render', editorRenderDir] + extra
}

def generateTasks = groups.collect { group ->
  tasks.register("generateComposeApi${group.name.capitalize()}", JavaExec) {
    description = "Regenerate group ${group.name} (schema, guest stubs, host renderers, lock, editor metadata) from Compose"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.keliver.compose.generator.MainKt'
    args = generatorArgs(group, [])
  }
}
def generateRoot = tasks.register('generateComposeApiRoot', JavaExec) {
  description = 'Regenerate the product root schema (root.json)'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dev.keliver.compose.generator.MainKt'
  args = rootArgs([])
}
def generateEditorRender = tasks.register('generateComposeApiEditorRender', JavaExec) {
  description = 'Regenerate the editor interpreter\'s dispatcher over the groups that write one'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dev.keliver.compose.generator.MainKt'
  args = editorRenderArgs([])
}
// Each group after the one before it: the prototype reads the factory tags core has just written
// (the values owner's lock is the one ordering the groups share).
generateTasks.eachWithIndex { task, i -> if (i > 0) task.configure { mustRunAfter(generateTasks[i - 1]) } }

// The shared `values` lock's own run (MS4-42, G1): the call records the guest builds (the guest's
// mirrors in keliver-compose-calls, the host's replay in keliver-compose-calls-composeui, the editor's
// kinds), from values.json. Its lock is values.lock.json: the one lock every group shares for values.
def valuesArgs = { List extra ->
  [
    '--values',
    '--config', file('values.json').absolutePath,
    '--lock', file('values.lock.json').absolutePath,
    '--classpath', configurations.composeApi.asPath,
    '--sources', configurations.composeSources.asPath,
    '--out-guest', rootProject.file('keliver-compose-calls/src/commonMain/kotlin').absolutePath,
    '--out-host', rootProject.file('keliver-compose-calls-composeui/src/commonMain/kotlin').absolutePath,
    '--out-editor', file('values.editor.json').absolutePath,
    '--out-report', file('values.report.md').absolutePath,
  ] + extra
}
def generateValues = tasks.register('generateComposeApiValues', JavaExec) {
  description = 'Regenerate the call records (guest mirrors, host replay, editor kinds) and the shared values lock from Compose'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dev.keliver.compose.generator.MainKt'
  args = valuesArgs([])
}

// The aggregate stays what CI and the docs run; each group's own task is generateComposeApi<Group>
// (generateComposeApiCore, ...Coil, ...Gatea), writing and checking only that group's files.
tasks.register('generateComposeApi') {
  group = 'build'
  description = 'Regenerate every generated group (the product\'s core and coil, and the prototype), the shared values, the root schema and the editor dispatcher from Compose'
  dependsOn(generateTasks + [generateValues, generateRoot, generateEditorRender])
}

// GeneratorTest reads the same Compose API (and, for default texts, its sources) the generator does.
tasks.named('test') {
  inputs.files(configurations.composeApi).withPropertyName('composeApi').withNormalizer(ClasspathNormalizer)
  inputs.files(configurations.composeSources).withPropertyName('composeSources').withNormalizer(ClasspathNormalizer)
  doFirst {
    systemProperty 'keliver.composeApi', configurations.composeApi.asPath
    systemProperty 'keliver.composeSources', configurations.composeSources.asPath
    systemProperty 'keliver.composeInput', composeInputVersions
  }
}

def checkTasks = groups.collect { group ->
  tasks.register("checkComposeApi${group.name.capitalize()}", JavaExec) {
    description = "Fails when group ${group.name}'s checked-in sources or lock differ from a fresh generation, or its lock changed other than by appends"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.keliver.compose.generator.MainKt'
    args = generatorArgs(group, ['--check'])
  }
}
def checkRoot = tasks.register('checkComposeApiRoot', JavaExec) {
  description = 'Fails when the checked-in root schema differs from root.json'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dev.keliver.compose.generator.MainKt'
  args = rootArgs(['--check'])
}

def checkEditorRender = tasks.register('checkComposeApiEditorRender', JavaExec) {
  description = 'Fails when the editor interpreter\'s checked-in dispatcher differs from a fresh generation'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dev.keliver.compose.generator.MainKt'
  args = editorRenderArgs(['--check'])
}

def checkValues = tasks.register('checkComposeApiValues', JavaExec) {
  description = 'Fails when the checked-in call records or the shared values lock differ from a fresh generation, or the lock changed other than by appends'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dev.keliver.compose.generator.MainKt'
  args = valuesArgs(['--check'])
}

tasks.register('checkComposeApi') {
  group = 'verification'
  description = 'Fails when any generated group\'s (or the shared values\', or the root\'s, or the editor dispatcher\'s) checked-in sources or lock differ from a fresh generation, or a lock changed other than by appends'
  dependsOn(checkTasks + [checkValues, checkRoot, checkEditorRender])
}
