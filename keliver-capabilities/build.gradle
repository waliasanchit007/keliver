import dev.keliver.buildsupport.WasmJs
import static dev.keliver.buildsupport.TargetGroup.Common

apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// Roadmap #16: pure capability interfaces used by production adapters,
// browser preview, and presenter tests. Zipline deliberately stays at the
// device edge so this module can compile into the Wasm editor.
redwoodBuild {
  targets(Common + WasmJs.Browser)
  publishing()
}

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api libs.kotlinx.coroutines.core
        api libs.kotlinx.serialization.json
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
      }
    }
  }
}
