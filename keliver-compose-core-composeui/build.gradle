// The product's generated core group (docs/MS4_PLAN.md, MS4-01): the host renderers on Compose UI.
// src/commonMain/…/Generated.kt is generated (each renderer calls the real Compose function); the
// runtime (children, converters, animated references, lazy lists, press, the retained container) and
// the extras' renderers are hand-written, copied from the prototype (keliver-compose-gatea-composeui,
// which keeps its own copy for NF5's measurements until MS4-40). Fixes go to this copy.
import dev.keliver.buildsupport.WasmJs
import static dev.keliver.buildsupport.TargetGroup.ToolkitComposeUi

redwoodBuild {
  // wasmJs: the editor canvas draws with these renderers in the browser (ED0).
  targets(ToolkitComposeUi + WasmJs.Browser)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverComposeCoreWidget
        // No root here: keliverComposeWidgetSystem() is keliver-compose-root-composeui's, so a
        // group's host module never depends on another group's (review of #313, M1).
        implementation projects.keliverWidgetComposeui
        implementation libs.jetbrains.compose.foundation
        // Animated references and AnimatedVisibility call the real animation API.
        implementation libs.jetbrains.compose.animation
        implementation libs.jetbrains.compose.material3
        implementation libs.jetbrains.compose.material.icons.core
        implementation libs.jetbrains.compose.material.icons.extended
        implementation libs.coil.compose.full
        implementation libs.jetbrains.compose.ui
      }
    }
    // The same-source samples, harness and pixel tests (SameSourceTest), and NF1's host tests
    // (LazyScrollTest; OneStatePerWidgetTest and PressHostTest, which are JVM-only in the
    // prototype), shared by the JVM and the iOS simulator. Not commonTest: Android unit tests and
    // JS/wasm would compile them.
    sameSourceTest {
      dependsOn commonTest
      dependencies {
        implementation libs.kotlin.test
        implementation libs.kotlinx.coroutines.test
        implementation libs.jetbrains.compose.ui.test
        implementation libs.jetbrains.compose.foundation
        implementation libs.jetbrains.compose.material3
        implementation libs.jetbrains.compose.material.icons.core
        implementation libs.jetbrains.compose.material.icons.extended
        implementation libs.coil.compose.full
        implementation projects.keliverComposeCoreCompose
        // The tests' own root system (TestRoot.kt): the root's widget system with core's renderers.
        // On the test classpath only, so core's main code never depends on the root.
        implementation projects.keliverComposeRootWidget
        implementation projects.keliverComposeRootProtocolGuest
        implementation projects.keliverComposeRootProtocolHost
        implementation projects.keliverProtocolGuest
        implementation projects.keliverProtocolHost
        implementation projects.keliverCompose
        implementation projects.keliverLeakDetector
      }
    }
    iosTest {
      dependsOn sameSourceTest
    }
    jvmTest {
      dependsOn sameSourceTest
      dependencies {
        implementation libs.kotlin.test
        implementation libs.kotlinx.coroutines.test
        implementation libs.jetbrains.compose.ui.test
        implementation rootProject.ext.skikoHostRuntime()
        implementation projects.keliverComposeCoreCompose
        implementation projects.keliverComposeRootWidget
        implementation projects.keliverComposeRootProtocolGuest
        implementation projects.keliverComposeRootProtocolHost
        implementation projects.keliverProtocolGuest
        implementation projects.keliverProtocolHost
        implementation projects.keliverCompose
        implementation projects.keliverLeakDetector
        // RetainedHostBackTest, PressSignalTest: keliver-nav's retained stack on the host container
        // (keliver-nav has jvm and js targets only, so not in sameSourceTest).
        implementation projects.keliverNav
      }
    }
  }
}

android {
  namespace 'dev.keliver.compose.core.composeui'
}

// The iOS same-source run writes its captures (native, guest, diff) beside the JVM ones. simctl
// passes SIMCTL_CHILD_* variables to the test process without the prefix.
// -Pkeliver.iosTestDevice=<udid> runs on that (shut down) simulator instead of Kotlin's default device.
def iosTestDevice = providers.gradleProperty('keliver.iosTestDevice')
tasks.withType(org.jetbrains.kotlin.gradle.targets.native.tasks.KotlinNativeSimulatorTest).configureEach {
  def out = layout.buildDirectory.dir("gate-ios/${name}").get().asFile
  environment('SIMCTL_CHILD_GATE_IOS_ARTIFACTS', out.absolutePath)
  if (iosTestDevice.present) device.set(iosTestDevice.get())
  doFirst { out.mkdirs() }
}

// The generator writes Generated.kt and the staleness guard compares it byte for byte: no spotless.
afterEvaluate {
  spotless {
    kotlin {
      targetExclude("src/**/Generated.kt")
    }
  }
}
