# This app's Keliver host settings (keliver-new-production-host.sh --embed).
# Each can be overridden on the command line: -Pkeliver.bundleServer=...
#
# Where the host finds published bundles: any server holding bundles/index.json
# and bundles/v<N>/ (keliver-publish writes them), or the portal relay. No query
# or fragment. A release build refuses http://.
keliver.bundleServer=@@BUNDLE_SERVER@@
# Optional: the base URL guests' HostHttp requests go to. Empty: no HostHttp.
keliver.apiBaseUrl=@@API_BASE_URL@@
# The release channel this host takes besides stable.
keliver.channel=@@CHANNEL@@
