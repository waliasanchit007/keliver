# This app's Keliver host settings (keliver-new-production-host.sh --embed).
# Each can be overridden on the command line: -Pkeliver.bundleServer=...
#
# Where the host finds published bundles: any server holding bundles/index.json
# and bundles/v<N>/ (keliver-publish writes them), or the portal relay. No query
# or fragment. A release build refuses http://.
keliver.bundleServer=@@BUNDLE_SERVER@@
# Optional: the base URL guests' HostHttp requests go to. Empty: no HostHttp.
keliver.apiBaseUrl=@@API_BASE_URL@@
# The release channel this host takes besides stable.
keliver.channel=@@CHANNEL@@
# When the running host looks for a newer bundle (W5): next-launch (only when
# the process starts), on-resume (also when your app calls
# KeliverHost.resumed(), applying a newer bundle at once) or live (on-resume,
# and in a debug build also while a KeliverScreen shows: it listens to the
# bundle server's /bundles/events, so a publish reaches the open app; other
# build types take live as on-resume). Empty: live in debug builds and
# next-launch in every other build type. A value here applies to every build
# type.
keliver.updates=
# Optional (W6): where the host POSTs a small JSON report of each outcome
# (loaded, fell back, update applied or failed, not loaded): your collector.
# Empty: no reports leave the device (the app still gets them in code).
keliver.reportUrl=
