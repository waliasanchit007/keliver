android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g

# Where this host finds published bundles: any server holding bundles/index.json
# and bundles/v<N>/ (keliver-publish writes them; a plain static file server or
# CDN is enough, and the host filters by its capabilities itself), or the
# portal relay. No query or fragment.
# An http:// URL turns on cleartext app-wide in DEBUG builds; a release build
# refuses it. Use https:// for anything real.
keliver.bundleServer=@@BUNDLE_SERVER@@

# Optional. Set it to give guests the HostHttp capability, pointed at your API.
# Left empty, the host neither provides HostHttp nor advertises it, so the
# bundle lookup never selects a bundle that needs it.
keliver.apiBaseUrl=@@API_BASE_URL@@

# The release channel this host takes from bundles/index.json, besides stable
# (W4.4): e.g. beta for testers. keliver-publish --channel publishes to one;
# --promote offers a published bundle on another. Lower-case letters, digits
# and '-'.
keliver.channel=@@CHANNEL@@
