android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g

# Where this host finds published bundles: the portal relay's /bundles API, or
# anything implementing it (/bundles/latest filters by the host's capabilities,
# so a plain static file server is not enough). No query or fragment.
# An http:// URL turns on cleartext app-wide in DEBUG builds; a release build
# refuses it. Use https:// for anything real.
keliver.bundleServer=@@BUNDLE_SERVER@@

# Optional. Set it to give guests the HostHttp capability, pointed at your API.
# Left empty, the host neither provides HostHttp nor advertises it, so the
# bundle lookup never selects a bundle that needs it.
keliver.apiBaseUrl=@@API_BASE_URL@@
