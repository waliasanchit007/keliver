android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g

# Where this host finds published bundles: any server holding bundles/index.json
# and bundles/v<N>/ (keliver-publish writes them; a plain static file server or
# CDN is enough, and the host filters by its capabilities itself), or the
# portal relay. No query or fragment.
# An http:// URL turns on cleartext app-wide in DEBUG builds; a release build
# refuses it. Use https:// for anything real.
keliver.bundleServer=@@BUNDLE_SERVER@@

# Optional. Set it to give guests the HostHttp capability, pointed at your API.
# Left empty, the host neither provides HostHttp nor advertises it, so the
# bundle lookup never selects a bundle that needs it.
keliver.apiBaseUrl=@@API_BASE_URL@@

# The release channel this host takes from bundles/index.json, besides stable
# (W4.4): e.g. beta for testers. keliver-publish --channel publishes to one;
# --promote offers a published bundle on another. Lower-case letters, digits
# and '-'.
keliver.channel=@@CHANNEL@@
# When the running host looks for a newer bundle (W5): next-launch (only when
# the process starts), on-resume (also each time the app comes back to the
# foreground, at most every 30 s, applying a newer bundle at once) or live
# (on-resume, and in a debug build also while a screen shows: the host listens
# to the bundle server's /bundles/events, so a publish reaches the open app;
# other build types take live as on-resume). Empty: live in debug builds and
# next-launch in every other build type. A value here applies to every build
# type.
keliver.updates=
# How the host starts (docs/DEVICE_HOST.md, "Start policy"): network-first
# (the lookup, then the bundle, before anything shows), parallel (the cached
# bundle loads while the lookup runs, and shows once the lookup confirms it; its
# calls out wait until then, and fail unsent when it is dropped) or cache-first
# (the cached bundle shows at once; a newer one the background lookup finds
# loads at the next start, or as an update with keliver.updates on-resume or
# live). Empty: network-first. A release owner's override in the index
# (keliver-publish --set-start-policy) takes its place from the next start,
# unless keliver.startPolicyOverride says none: an app that must start
# network-first whatever the index says sets network-first AND none.
keliver.startPolicy=
# Whether the index's start policy override may change this app's policy: any
# (the default when empty) or none (the app's own keliver.startPolicy always).
keliver.startPolicyOverride=
# Optional (W6): where the host POSTs a small JSON report of each outcome
# (loaded, fell back, update applied or failed, not loaded): your collector.
# Empty: no reports leave the device (the app still gets them in code).
keliver.reportUrl=
