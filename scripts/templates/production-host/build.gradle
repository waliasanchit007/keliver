// This app's PRODUCTION Android host. Scaffolded by keliver-new-production-host.sh;
// yours to edit from here on.
//
// What makes it production-only:
// * it loads only bundles whose manifest verifies against the public key in
//   src/main/assets/keliver/portal_ed25519.pub (checked below at build time, and again
//   on the device before anything is fetched);
// * it has no development path — for that, use the generic development host
//   from the tools bundle, which refuses production.
plugins {
  id 'com.android.application' version '@@AGP_VERSION@@'
  id 'org.jetbrains.kotlin.android' version '@@KOTLIN_VERSION@@'
  id 'org.jetbrains.kotlin.plugin.compose' version '@@KOTLIN_VERSION@@'
  id 'org.jetbrains.compose' version '@@COMPOSE_VERSION@@'
  id 'app.cash.zipline' version '@@ZIPLINE_VERSION@@' // IR rewrite of zipline.take/bind
}

def bundleServer = providers.gradleProperty('keliver.bundleServer').getOrElse('').trim()
def apiBaseUrl = providers.gradleProperty('keliver.apiBaseUrl').getOrElse('').trim()
def reportUrl = providers.gradleProperty('keliver.reportUrl').getOrElse('').trim()
def channel = providers.gradleProperty('keliver.channel').getOrElse('stable').trim()
def updates = providers.gradleProperty('keliver.updates').getOrElse('next-launch').trim()
// ASCII URL characters only; the bundle server takes no query or fragment,
// because the host appends its own path to it.
def serverUrl = /https?:\/\/[A-Za-z0-9._~:\/\[\]@!$&()*+,;=%-]+/
def apiUrl = /https?:\/\/[A-Za-z0-9._~:\/?#\[\]@!$&()*+,;=%-]+/
if (!(bundleServer ==~ serverUrl)) {
  throw new GradleException("keliver.bundleServer must be an http:// or https:// URL without a query " +
    "(got '$bundleServer'). Set it in gradle.properties or pass -Pkeliver.bundleServer=...")
}
if (apiBaseUrl && !(apiBaseUrl ==~ apiUrl)) {
  throw new GradleException("keliver.apiBaseUrl must be empty or an http:// or https:// URL (got '$apiBaseUrl').")
}
// The report URL: no user@, query or fragment (a secret there would sit in the
// APK and in every request line), as for the iOS host's REPORT_URL.
def reportUrlPattern = /https?:\/\/[A-Za-z0-9._~:\/\[\]!$&()*+,;=%-]+/
if (reportUrl && !(reportUrl ==~ reportUrlPattern)) {
  throw new GradleException("keliver.reportUrl must be empty or an http:// or https:// URL with no user@, query or fragment (got '$reportUrl').")
}
if (!(channel ==~ /[a-z0-9][a-z0-9-]{0,31}/)) {
  throw new GradleException("keliver.channel must be lower-case letters, digits and '-', at most 32 (got '$channel').")
}
if (!(updates in ['next-launch', 'on-resume'])) {
  throw new GradleException("keliver.updates must be next-launch or on-resume (got '$updates').")
}
def cleartext = bundleServer.startsWith('http:') || apiBaseUrl.startsWith('http:') || reportUrl.startsWith('http:')

// The embedded key, checked by checkPortalKey (below) and compiled into
// BuildConfig.KELIVER_PUBLIC_KEY_HEX: the host reads it from there, never from
// the merged assets, where an app's or another library's file of the same name
// would win.
def portalKey = file('src/main/assets/keliver/portal_ed25519.pub')
def portalKeyHex = portalKey.isFile() ? portalKey.text.trim().toLowerCase() : ''

android {
  namespace '@@PACKAGE@@'
  compileSdk 35
  defaultConfig {
    applicationId '@@APPLICATION_ID@@'
    // 23: below it Android ignores usesCleartextTraffic, so http would be allowed
    // whatever the manifest says.
    minSdk 23
    targetSdk 35
    versionCode 1
    versionName '1.0'
    // Off for every build type unless one turns it on (only debug does).
    manifestPlaceholders = [usesCleartextTraffic: 'false']
    buildConfigField 'String', 'KELIVER_BUNDLE_SERVER', "\"${bundleServer.replaceAll('/+$', '')}\""
    buildConfigField 'String', 'KELIVER_API_BASE_URL', "\"${apiBaseUrl.replaceAll('/+$', '')}\""
    buildConfigField 'String', 'KELIVER_REPORT_URL', "\"${reportUrl}\""
    buildConfigField 'String', 'KELIVER_CHANNEL', "\"${channel}\""
    buildConfigField 'String', 'KELIVER_UPDATES', "\"${updates}\""
    buildConfigField 'String', 'KELIVER_PUBLIC_KEY_HEX', "\"${portalKeyHex ==~ /[0-9a-f]{64}/ ? portalKeyHex : ''}\""
  }
  buildTypes {
    // Cleartext (app-wide on Android) only in DEBUG builds, and only when a
    // configured server is plain http — an emulator reaching a relay. A release
    // build with an http server is refused outright (checkReleaseUrls, below).
    debug { manifestPlaceholders = [usesCleartextTraffic: cleartext.toString()] }
  }
  buildFeatures { compose true; buildConfig true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
kotlin { jvmToolchain(17) }

// The embedded key is the whole of this host's trust: a missing or malformed
// one fails the BUILD, not just a launch on someone's device.
def checkPortalKey = tasks.register('checkPortalKey') {
  inputs.file(portalKey)
  doLast {
    def hex = portalKey.text.trim()
    if (!(hex ==~ /[0-9a-fA-F]{64}/)) {
      throw new GradleException("$portalKey is not a 64-hex-digit Ed25519 public key. Re-run " +
        "keliver-new-production-host.sh, or copy your portal store's keys/ed25519.pub there.")
    }
  }
}
tasks.named('preBuild') { dependsOn checkPortalKey }

// A non-debug build talks https or not at all. It still needs YOUR signing config
// (android { signingConfigs { ... } }) before it will install anywhere.
def checkReleaseUrls = tasks.register('checkReleaseUrls') {
  doLast {
    if (cleartext) {
      throw new GradleException("A release build needs https:// servers; keliver.bundleServer is " +
        "'$bundleServer', keliver.apiBaseUrl is '$apiBaseUrl' and keliver.reportUrl is '$reportUrl'. Use an http:// server only for debug builds.")
    }
  }
}
// Every non-debug variant — release, custom build types, any flavor.
androidComponents {
  onVariants(selector().all()) { variant ->
    if (variant.buildType != 'debug') {
      def pre = "pre${variant.name.capitalize()}Build"
      tasks.configureEach { t -> if (t.name == pre) t.dependsOn checkReleaseUrls }
    }
  }
}

dependencies {
  implementation 'dev.keliver:keliver-treehouse-host:@@KELIVER_VERSION@@'
  implementation 'dev.keliver:keliver-treehouse-host-composeui:@@KELIVER_VERSION@@'
  implementation 'dev.keliver:keliver-material-composeui:@@KELIVER_VERSION@@'
  implementation 'dev.keliver:keliver-material-protocol-host-web:@@KELIVER_VERSION@@'
  implementation 'dev.keliver:portal-sql:@@KELIVER_VERSION@@'
  implementation 'dev.keliver:keliver-http:@@KELIVER_VERSION@@'
  implementation 'app.cash.zipline:zipline:@@ZIPLINE_VERSION@@'
  implementation 'app.cash.zipline:zipline-loader:@@ZIPLINE_VERSION@@'
  implementation 'com.squareup.okhttp3:okhttp:5.1.0'
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation 'androidx.core:core-ktx:1.16.0'
  implementation 'io.coil-kt.coil3:coil-compose-core:3.3.0'
  implementation 'io.coil-kt.coil3:coil-network-okhttp:3.3.0'
  implementation 'org.jetbrains.compose.runtime:runtime:@@COMPOSE_VERSION@@'
  implementation 'org.jetbrains.compose.foundation:foundation:@@COMPOSE_VERSION@@'
  implementation 'org.jetbrains.compose.material:material:@@COMPOSE_VERSION@@'
  implementation 'org.jetbrains.compose.ui:ui:@@COMPOSE_VERSION@@'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}
