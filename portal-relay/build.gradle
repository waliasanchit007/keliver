// spike/keliver-web portal — the local-first PORTAL SERVER (P2/P4). JDK
// HttpServer + files; portal-core (project dep) supplies the tree codec and
// the generated exporter for the publish pipeline. No external deps.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization' // PortalConfig (keliver.portal.json)
apply plugin: 'application'

application {
  mainClass = 'RelayKt'
}

// Driven checks (keliver-verify-signed-bundle.sh, keliver-store-recovery-check.sh)
// pass their inputs as -D on the Gradle command line. That reaches the GRADLE
// JVM, not the forked test JVM, so the tests saw null, took their "skipped"
// branch and the build went green — a verification that never verified
// anything. Forward the ones those checks use, explicitly.
tasks.withType(Test).configureEach {
  [
    'keliver.verify.manifest', 'keliver.verify.pubkey',
    'keliver.sign.privkey', 'keliver.sign.manifest', 'keliver.sign.out',
  ].each { key ->
    def value = System.getProperty(key)
    if (value != null) systemProperty(key, value)
  }
}

dependencies {
  implementation projects.keliverCapabilities // #16 H1: pure HostHttp replay envelope
  implementation projects.portalCore
  implementation projects.portalFlow     // #13 F1: FlowSpec (declarations parsed by ingest)
  implementation projects.portalDocument // V2 M1: live document + op engine
  implementation projects.portalIngest   // V2 M3: recognizer + reconciler
  implementation libs.kotlinx.serialization.json // DocJson wire
  implementation libs.okhttp // #16 H2: bounded, DNS-pinned secure recording transport
  implementation 'io.methvin:directory-watcher:0.19.0' // V2 M3: fsevents file-watch (JDK WatchService = 2s polling on macOS)
  testImplementation libs.junit
  // Verify a REAL signed bundle with Zipline's own verifier rather than a
  // hand-rolled check. Test-only.
  testImplementation libs.zipline.loader
  testImplementation libs.kotlin.test.junit
}

// W3: keliver-publish, the relay's publish without the relay. Its start script
// sits beside portal-relay's in bin/; the tools bundle's bin/keliver-publish
// wrapper runs it.
def keliverPublishStartScripts = tasks.register('keliverPublishStartScripts', CreateStartScripts) {
  mainClass = 'KeliverPublish'
  applicationName = 'keliver-publish-jvm'
  outputDir = layout.buildDirectory.dir('keliver-publish-scripts').get().asFile
  classpath = tasks.named('startScripts').get().classpath
}
distributions { main { contents { from(keliverPublishStartScripts) { into 'bin' } } } }

// The production hosts' index reader (scripts/templates/*/BundleIndex.kt) is
// template source with a @@PACKAGE@@ placeholder. Compile the Android copy into
// the tests, so BundleIndexTest runs the code the scaffolders ship; the test
// also holds the iOS copy byte-identical to it.
def hostTemplateTestSource = tasks.register('hostTemplateTestSource', Copy) {
  from(rootProject.file('scripts/templates/production-host/src/main/kotlin/BundleIndex.kt'))
  filter { line -> line.replace('@@PACKAGE@@', 'hosttemplate') }
  into layout.buildDirectory.dir('generated/hostTemplate/kotlin')
}
sourceSets.test.kotlin.srcDir(hostTemplateTestSource)
