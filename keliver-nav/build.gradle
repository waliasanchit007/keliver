// Typed guest-side navigation — KeliverNavController + KeliverNavHost
// + LocalKeliverNavController. Replaces the per-app HostNavigator
// RPC-per-route boilerplate with a guest-owned typed back stack that
// mirrors Compose Navigation ergonomics. See issue #25.

import static dev.keliver.buildsupport.TargetGroup.TreehouseGuest

redwoodBuild {
  targets(TreehouseGuest)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api libs.jetbrains.compose.runtime
        api libs.jetbrains.compose.runtime.saveable
        api libs.kotlinx.coroutines.core
        // LocalBackHandlersEnabled: a hidden retained entry's BackHandlers must not take back presses.
        implementation projects.keliverCompose
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
        implementation libs.kotlinx.coroutines.test
      }
    }
  }
}
