// Spike (docs/COMPOSE_GENERIC_MECHANISMS.md): the three generic generator mechanisms (call records,
// remote objects, recorded interfaces), generated by :keliver-compose-generator:generateGenericSpike
// into src/main/kotlin (Generated*.kt), with the small hand-written runtime they share. Guest and host
// halves sit in one JVM module so the tests can run a guest recording through JSON into a real
// Compose host. Not published, no API dump.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

dependencies {
  // Guest half: the hand codecs that stay (Color, Dp, TextUnit) and Compose's runtime.
  implementation projects.keliverComposeValues
  implementation libs.kotlinx.serialization.json
  implementation libs.kotlinx.coroutines.core
  // Host half: the real Compose.
  implementation libs.jetbrains.compose.foundation
  implementation libs.jetbrains.compose.ui

  testImplementation libs.junit
  testImplementation libs.kotlin.test.junit
  testImplementation libs.kotlinx.coroutines.test
  testImplementation libs.jetbrains.compose.ui.test
  testImplementation rootProject.ext.skikoHostRuntime()
}

// The generated files are compared byte for byte by GenericEmitTest: no spotless.
afterEvaluate {
  if (extensions.findByName('spotless') != null) {
    spotless {
      kotlin {
        targetExclude("src/**/Generated*.kt")
      }
    }
  }
}
