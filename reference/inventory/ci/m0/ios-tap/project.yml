# The iOS tap driver for ios-timing.sh's T3: one UI-testing bundle with no app of its own,
# which drives the host by bundle id. IosTap.xcodeproj is generated from this file and
# checked in, so CI needs no xcodegen; after a change here: xcodegen generate --spec project.yml
name: IosTap
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  IosTapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AddOneTwice.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.keliver.reference.iostap
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  IosTap:
    build:
      targets:
        IosTapUITests: [test]
    test:
      targets: [IosTapUITests]
