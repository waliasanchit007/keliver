name: Kotlin Compatibility Matrix

# Informational job: build Keliver against a Kotlin NEWER than the pin, to catch IR/FIR plugin
# breakage early (Keliver's own compiler plugins, and the Zipline fork's compiler plugin under a
# newer compiler). Failures are NOT blocking. When this fails, file an issue and document in
# docs/UPGRADING_KOTLIN.md.
#
# PAUSED (NF2, PR #294): the only leg left is the pin itself, which repeats ci.yml's build and
# tests nothing new, so the weekly schedule is off; workflow_dispatch still runs it. The schedule
# comes back with a leg for the next newer Kotlin (a 2.4.x after 2.4.21, or a 2.5 pre-release),
# which runs the fork's compiler plugin under that compiler:
#   schedule:
#     - cron: '0 9 * * 1'  # Mondays 09:00 UTC

on:
  workflow_dispatch: {}

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dkotlin.incremental=false"

jobs:
  compat:
    name: Kotlin ${{ matrix.kotlin }}
    runs-on: ubuntu-latest
    continue-on-error: true  # informational only
    strategy:
      fail-fast: false
      # No leg below the pin: the Keliver fork of Zipline's Gradle plugin is built with Kotlin
      # 2.4.21 and requires that kotlin-gradle-plugin, so Gradle lifts an older -PkotlinVersion to
      # 2.4.21 and such a leg would only rebuild the pin (the fork's README, "Kotlin
      # compatibility"). Add newer Kotlin versions here when they ship (a higher version wins),
      # and restore the schedule above with the first one.
      matrix:
        kotlin:
          - "2.4.21"  # current pin (sanity check)

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v4

      # The version override mechanism is wired into the keliver settings
      # plugin. -PkotlinVersion=X overrides libs.versions.toml's "kotlin"
      # entry for this build only.
      - name: Build (Kotlin ${{ matrix.kotlin }})
        run: >
          ./gradlew
          publishToMavenLocal
          -x test
          -x allTests
          -x jvmTest
          -x jsBrowserTest
          -x jsNodeTest
          -DRELEASE_SIGNING_ENABLED=false
          -PkotlinVersion=${{ matrix.kotlin }}
