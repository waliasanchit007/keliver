# The production iOS host, end to end on a hosted macOS runner (W1 I2 in
# docs/DELIVERY_PLAN.md).
#
# 1. keliver-new-ios-host-selftest.sh --build:
#    - the scaffolder's refusals leave the app byte-identical;
#    - its output is complete;
#    - xcodebuild builds the app for the simulator from Maven Central;
#    - a release refuses http://;
#    - a malformed key fails the build.
# 2. reference/inventory/ci/ios.sh:
#    - the inventory app is recreated from the PUBLIC tools 0.3.11 release
#      (hash pinned);
#    - it publishes signed v1;
#    - the host scaffolded by that zip's own bin/keliver-new-ios-host.sh runs on
#      an iOS simulator through P1, P2 and P4–P7: signed v1, v2 after an edit, a
#      foreign key refused, recovery, and an offline start from the cache;
#    - then the static route: keliver-publish into a static HTTPS server whose
#      throwaway CA only this run's simulator trusts, with no relay (S2-S16),
#      the embedded host (W2), updates and reports (W5, W6).
#    The scaffolders and keliver-publish are the zip's own in a run started by
#    hand, and this checkout's scripts/ in a pull request (KELIVER_SCAFFOLD_FROM).
#      Screens are read by macOS Vision.
#
# Read-only: no secrets, no publishing. The keys are disposable and generated
# inside the run. Triggered on pull requests touching the iOS host. A workflow
# can't be dispatched until it is on the default branch.
name: ios-host
on:
  pull_request:
    paths:
      - "scripts/keliver-new-ios-host.sh"
      - "scripts/keliver-new-ios-host-selftest.sh"
      - "scripts/templates/ios-host/**"
      - "reference/inventory/ci/ios.sh"
      - "reference/inventory/ci/ocr.swift"
      - "reference/inventory/ci/w3/**"
      - "reference/inventory/ci/w2/**"
      - "reference/inventory/ci/w5/**"
      - "reference/inventory/ci/w8/**"
      - "reference/inventory/ci/m0/**"
      - "reference/inventory/app/src/jsMain/kotlin/device/**"
      - "reference/embed/ios/**"
      - "scripts/templates/ios-host-embed/**"
      - "scripts/keliver-publish"
      - "portal-relay/src/main/kotlin/StaticIndex.kt"
      - "portal-relay/src/main/kotlin/KeliverPublish.kt"
      - "portal-relay/src/main/kotlin/PublishSignature.kt"
      - "portal-relay/src/main/kotlin/KeyRotation.kt"
      - "scripts/templates/publish/**"
      - ".github/workflows/ios-host.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ios-host:
    runs-on: macos-15
    # Observed 99-162 minutes with M0 (runner speed varies; 160 was hit once).
    timeout-minutes: 200
    permissions:
      contents: read
    env:
      # Which scaffolders and keliver-publish are under test. A pull request
      # tests ITS OWN scripts/ (repo): template changes are what it changes.
      # A run started by hand (workflow_dispatch) uses only the published zip's
      # bin/ (zip): the published-only proof of the release pinned below.
      # Everything else always comes from the published zip.
      KELIVER_SCAFFOLD_FROM: ${{ github.event_name == 'workflow_dispatch' && 'zip' || 'repo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: The toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
          java -version 2>&1 | head -1

      - name: Download the PUBLIC tools 0.3.11 release, as the adopter guide does
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$GITHUB_WORKSPACE/ios-evidence"
          cd "$RUNNER_TEMP/dl"
          base=https://github.com/waliasanchit007/keliver/releases/download/portal-tools-v0.3.11
          curl -fsSLO "$base/keliver-portal-tools-0.3.11.zip"
          curl -fsSLO "$base/keliver-portal-tools-0.3.11.zip.sha256"
          {
            echo "downloaded: $base/keliver-portal-tools-0.3.11.zip"
            shasum -a 256 -c keliver-portal-tools-0.3.11.zip.sha256
            shasum -a 256 keliver-portal-tools-0.3.11.zip
            unzip -p keliver-portal-tools-0.3.11.zip 'keliver-portal-tools-0.3.11/VERSION.json'
          } | tee "$GITHUB_WORKSPACE/ios-evidence/public-download.txt"
          test "$(shasum -a 256 keliver-portal-tools-0.3.11.zip | cut -d' ' -f1)" = \
            ae84cb2c5442948dbd8272a5a9f0d1f0d9bf42377475168d3f9c31ab1f26bddf
          unzip -p keliver-portal-tools-0.3.11.zip 'keliver-portal-tools-0.3.11/VERSION.json' \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['sourceCommit'] == 'ebbb24c9649d42d7f15d11165031dbe733905056'"

      - name: The iOS host scaffolder's self-test, with xcodebuild
        run: |
          set -o pipefail
          bash scripts/keliver-new-ios-host-selftest.sh "$RUNNER_TEMP/selftest" --build \
            | tee "$GITHUB_WORKSPACE/ios-evidence/selftest.txt"

      - name: iOS production OTA on the simulator — P1, P2, P4–P7
        run: |
          bash reference/inventory/ci/ios.sh "$RUNNER_TEMP/ios" "$GITHUB_WORKSPACE/ios-evidence" \
            "$RUNNER_TEMP/dl/keliver-portal-tools-0.3.11.zip"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-host-evidence-${{ github.run_id }}
          path: ios-evidence/
          if-no-files-found: warn
          retention-days: 30
