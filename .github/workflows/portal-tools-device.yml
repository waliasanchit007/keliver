# Device verification for a tools candidate — MANUAL ONLY, and read-only.
#
# It installs the APK from a RETAINED candidate artifact (never a rebuild) on an
# x86_64 emulator and exercises what U22 is actually about:
#
#   * the bundled host is development-only and REFUSES production mode, with
#     nothing fetched;
#   * the ordinary development route still works.
#
# Why this can work here, and what is still unproven:
#   - the packaged APK carries lib/x86_64 (as well as arm64-v8a, armeabi-v7a,
#     x86), so a standard x86_64 system image can run it. Verified by inspecting
#     the 0.3.4 artifact.
#   - ubuntu-24.04 hosted runners (this repo's runs use
#     actions/runner-images ubuntu24/20260907.300) expose /dev/kvm; the udev
#     rule below is the standard way to make it usable by the runner user.
#   - THIS WORKFLOW HAS NEVER BEEN RUN. KVM availability and the emulator's disk
#     appetite on a hosted runner are expectations, not measurements. The first
#     run is the experiment.
#
# It cannot publish: contents:read, actions:read, no release step, no tag.
name: portal-tools-device
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the portal-tools run holding the candidate artifact"
        required: true
      expected_apk_sha256:
        description: "sha256 of the APK that must be inside that artifact"
        required: true
permissions:
  contents: read
  actions: read
jobs:
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch the RETAINED candidate artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: keliver-portal-tools-*
          merge-multiple: true
          path: candidate

      - name: Identify the APK under test
        id: apk
        run: |
          set -euo pipefail
          zip="$(ls candidate/keliver-portal-tools-*.zip)"
          echo "zip: $zip"; sha256sum "$zip"
          entry="$(unzip -Z1 "$zip" | grep -E 'host/.*\.apk$')"
          unzip -p "$zip" "$entry" > host.apk
          got="$(sha256sum host.apk | cut -d' ' -f1)"
          echo "apk sha256: $got"
          test "$got" = "${{ github.event.inputs.expected_apk_sha256 }}"
          # The bundled host must still be key-free at the point of install.
          if unzip -l host.apk | grep -q 'assets/portal_ed25519.pub'; then
            echo "::error::the APK under test embeds a portal key"; exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          df -h / /mnt || true

      - name: Boot an emulator and run the device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          # aosp_atd is the smallest x86_64 image and is built for CI. API 33
          # has no "default" (AOSP) x86_64 image, so that would not resolve.
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            SERIAL="$(adb devices | awk '/device$/{print $1; exit}')"
            echo "serial: $SERIAL"

            # 1. The documented development route, end to end, from the package.
            #    This installs the host and drives the guide's device steps.
            scripts/keliver-adopter-acceptance.sh "$RUNNER_TEMP/acceptance" \
              "${{ steps.apk.outputs.zip }}" --serial "$SERIAL"

            # 2. Production mode must be REFUSED, and nothing may be fetched.
            adb -s "$SERIAL" logcat -c
            adb -s "$SERIAL" shell am force-stop dev.keliver.portaldevice
            adb -s "$SERIAL" shell am start -n \
              dev.keliver.portaldevice/dev.keliver.portaldevice.host.MainActivity \
              --es mode prod
            sleep 12
            adb -s "$SERIAL" logcat -d > prod-attempt.log
            adb -s "$SERIAL" exec-out screencap -p > prod-refused.png
            adb -s "$SERIAL" shell uiautomator dump /sdcard/prod.xml >/dev/null
            adb -s "$SERIAL" shell cat /sdcard/prod.xml > prod-ui.xml

            grep -q "refusing production mode" prod-attempt.log \
              || { echo "::error::no refusal logged"; exit 1; }
            grep -qi "Production mode refused" prod-ui.xml \
              || { echo "::error::the refusal is not on screen"; exit 1; }
            # Nothing may have been fetched for a refused session.
            if grep -qE "prod mode: loading|manifest.zipline.json" prod-attempt.log; then
              echo "::error::a manifest or bundle was requested for a refused session"; exit 1
            fi

            # 3. The development route still works after the refusal.
            adb -s "$SERIAL" logcat -c
            adb -s "$SERIAL" shell am force-stop dev.keliver.portaldevice
            adb -s "$SERIAL" shell am start -n \
              dev.keliver.portaldevice/dev.keliver.portaldevice.host.MainActivity
            sleep 10
            adb -s "$SERIAL" logcat -d > dev-after.log
            grep -q "mode=dev" dev-after.log \
              || { echo "::error::the development route did not start"; exit 1; }
            grep -q "refusing production mode" dev-after.log \
              && { echo "::error::the development route was refused"; exit 1; }
            adb -s "$SERIAL" exec-out screencap -p > dev-after.png
            echo "device checks passed"

      - name: Keep the device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-evidence-${{ github.event.inputs.run_id }}
          path: |
            prod-attempt.log
            prod-refused.png
            prod-ui.xml
            dev-after.log
            dev-after.png
          if-no-files-found: warn
