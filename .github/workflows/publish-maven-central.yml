name: Publish to Maven Central

# Publishes Keliver artifacts to Maven Central (Sonatype Central Portal)
# under the `dev.keliver` namespace — verified on Sonatype via a DNS TXT
# record on the keliver.dev domain (see docs/MAVEN_CENTRAL_SETUP.md).
#
# This is intentionally MANUAL-ONLY (workflow_dispatch). It is gated on
# four repo secrets that only the maintainer can provision — see
# docs/MAVEN_CENTRAL_SETUP.md:
#   SONATYPE_USERNAME / SONATYPE_PASSWORD  (Central Portal user token)
#   SIGNING_KEY / SIGNING_PASSWORD         (armored GPG private key + passphrase)
# Until those exist, running this workflow fails fast at the preflight
# guard with a legible message rather than a confusing Gradle error.
#
# It is deliberately SEPARATE from publish.yml (which pushes to GitHub
# Packages on every `v*` tag). Keeping them apart means the existing
# private-consumer flow is never blocked on Central credentials, and the
# two channels can co-exist.
#
# Coordinates: publishes under the default Gradle group `dev.keliver`
# (set by KELIVER_GROUP_ID in RedwoodBuildPlugin.kt) — no override needed,
# because the project owns keliver.dev and verifies `dev.keliver`
# directly. This is also what makes the Gradle plugin markers
# (`dev.keliver.*.gradle.plugin`) publishable — they're under the owned
# namespace. The version comes from KELIVER_VERSION — bump it before
# releasing. Note: `*-SNAPSHOT` versions route to the Central snapshots
# repository, not the main index.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish (commit allowed only for a SNAPSHOT)"
        required: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dkotlin.incremental=false"

jobs:
  # Everything that must be green BEFORE the irreversible upload. `publish`
  # declares `needs: preflight`, so a tag cannot reach Central without this
  # having passed on the exact ref being published.
  #
  # Why a separate job rather than dropping `-x test` from the publish step:
  # `publishToMavenCentral` uploads a SINGLE deployment bundle spanning every
  # module target. Making test execution a precondition inside that task means
  # a flaky test can fail partway through the upload, and the failure mode
  # there is a partial deployment on an endpoint with no undo. Tests gate the
  # job; they must not gate the upload task.
  preflight:
    name: Preflight (gates the irreversible publish)
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      # Cheapest check first: fail in seconds rather than after a full build if
      # the maintainer hasn't provisioned the secrets (Setup doc Steps 1-3).
      - name: Verify publishing secrets exist
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          missing=""
          [ -z "$SONATYPE_USERNAME" ] && missing="$missing SONATYPE_USERNAME"
          [ -z "$SONATYPE_PASSWORD" ] && missing="$missing SONATYPE_PASSWORD"
          [ -z "$SIGNING_KEY" ]       && missing="$missing SIGNING_KEY"
          [ -z "$SIGNING_PASSWORD" ]  && missing="$missing SIGNING_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing — see docs/MAVEN_CENTRAL_SETUP.md Steps 1-3."
            exit 1
          fi
          echo "All four publishing secrets are present."

      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v4

      # Stable releases are immutable and must be traceable to their exact
      # canonical tag. SNAPSHOT builds may still be preflighted from a commit.
      - name: Verify release ref matches build version
        run: |
          ref="${{ inputs.ref }}"
          tag_version="${{ inputs.ref }}"
          tag_version="${tag_version#v}"
          build_version=$(grep 'KELIVER_VERSION' build-support/src/main/kotlin/dev/keliver/buildsupport/RedwoodBuildPlugin.kt | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Release ref:   $ref"
          echo "Build version: $build_version"
          if [[ "$build_version" != *-SNAPSHOT && "$ref" != "v$build_version" ]]; then
            echo "::error::Stable release $build_version must be published from its exact v$build_version tag."
            exit 1
          fi
          if [[ "$ref" == v* && "$tag_version" != "$build_version" ]]; then
            echo "::error::Tag $tag_version doesn't match KELIVER_VERSION $build_version. Bump the constant before tagging."
            exit 1
          fi

      # The gate itself. Same script a maintainer runs locally before tagging —
      # ONE definition, so the local check and the release check cannot drift.
      # Covers: clean tree, versioned publishToMavenLocal, portal codegen
      # freshness, test + apiCheck, the portal multiplatform suites (K1 parity,
      # document write-back engine), the wasm render host, and the
      # zero-checkout consumer proof against the staged candidate.
      #
      - name: Release preflight
        run: scripts/keliver-release-preflight.sh

  publish:
    name: Publish to Maven Central
    needs: preflight
    # macOS needed to publish iOS klibs. Falls back to cloud `macos-latest`
    # if no `CI_RUNNER` repo variable is set.
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    permissions:
      contents: read

    steps:
      # Re-checked here because `publish` can in principle be re-run
      # independently of the job that gated it.
      - name: Preflight — verify publishing secrets exist
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          missing=""
          [ -z "$SONATYPE_USERNAME" ] && missing="$missing SONATYPE_USERNAME"
          [ -z "$SONATYPE_PASSWORD" ] && missing="$missing SONATYPE_PASSWORD"
          [ -z "$SIGNING_KEY" ]       && missing="$missing SIGNING_KEY"
          [ -z "$SIGNING_PASSWORD" ]  && missing="$missing SIGNING_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing — see docs/MAVEN_CENTRAL_SETUP.md Steps 1-3."
            exit 1
          fi
          echo "All four publishing secrets are present."

      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify release ref matches build version
        run: |
          ref="${{ inputs.ref }}"
          tag_version="${{ inputs.ref }}"
          tag_version="${tag_version#v}"
          build_version=$(grep 'KELIVER_VERSION' build-support/src/main/kotlin/dev/keliver/buildsupport/RedwoodBuildPlugin.kt | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Release ref:   $ref"
          echo "Build version: $build_version"
          if [[ "$build_version" != *-SNAPSHOT && "$ref" != "v$build_version" ]]; then
            echo "::error::Stable release $build_version must be published from its exact v$build_version tag."
            exit 1
          fi
          if [[ "$ref" == v* && "$tag_version" != "$build_version" ]]; then
            echo "::error::Tag $tag_version doesn't match KELIVER_VERSION $build_version. Bump the constant before tagging."
            exit 1
          fi

      - name: Publish to Maven Central
        # `publishToMavenCentral` uploads a single deployment bundle for all
        # modules; the build sets automaticRelease=true so it also releases.
        # Signing is on (RELEASE_SIGNING_ENABLED defaults to true) — Central
        # rejects unsigned artifacts.
        #
        # `-x test` is deliberate and must stay: the `preflight` job above has
        # already run the full suite on this exact ref. Re-running tests inside
        # the upload task would risk failing partway through an irreversible
        # single-bundle deployment.
        run: >
          ./gradlew
          publishToMavenCentral
          -x test
        env:
          # vanniktech maven-publish reads these project properties (Gradle
          # auto-maps ORG_GRADLE_PROJECT_X -> project property X).
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
