name: Nightly full build

# The whole graph's `build apiCheck` on main, once a night. ci.yml runs a chosen list of tasks on
# every pull request (tests, API checks, spotlessCheck, validatePlugins, the generated-code
# guards); `build` also runs `check` and every assemble task, which ci.yml does not. Before #302
# that gap let 51 task failures pile up on main unseen. A red run here is that drift showing up
# within a day. Owner decision 2026-11-23.
#
# A failed scheduled run is emailed to whoever last changed the cron line, and is listed under
# Actions. Fix it on main like any other red build.

on:
  schedule:
    - cron: '17 21 * * *'  # 21:17 UTC = 02:47 IST, after the day's merges
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-full-build
  cancel-in-progress: false

jobs:
  build:
    name: build apiCheck (full graph)
    # Only on the main repository: a fork's copy of this schedule does nothing.
    if: github.repository == 'waliasanchit007/keliver'
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    # ci.yml's build job takes 85-100 minutes for a narrower task list; the whole graph measured
    # 12 minutes warm on the owner's Mac but is cold here. 240 is a ceiling, not an estimate.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Read ci.yml's cache; never write one (this job's outputs would crowd it out).
          cache-read-only: true

      - name: build apiCheck --continue
        run: >
          ./gradlew
          build apiCheck
          --continue
          -DRELEASE_SIGNING_ENABLED=false

      - name: Test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14
