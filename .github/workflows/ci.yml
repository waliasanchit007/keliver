name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags-ignore: ['**']
  workflow_dispatch: {}

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dkotlin.incremental=false"

# Cancel an older pull request run when a new push lands. Pushes to main are never cancelled:
# only a main run that finishes saves the Gradle cache every pull request reads, and merges
# often land minutes apart (2026-11-11: two main runs in a row were cancelled by the next merge).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The docs fast path (docs/PLAN_2026-11.md section 14). A pull request that
  # changes only Markdown (*.md) skips the build and the embed floor: the docs
  # job below is its check. Markdown the build reads counts as code:
  # docs/PORTAL_ADOPTER_GUIDE.md is bundled into portal-mcp and checked by its
  # GuideTest. Pushes to main and manual runs always build. (grep reads all of
  # its input from a here-string: `cmd | grep -q` under pipefail can report a
  # SIGPIPE'd writer as a failed match on a long list.)
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          if grep -Evq '\.md$' <<<"$changed" || grep -Eq '^docs/PORTAL_ADOPTER_GUIDE\.md$' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs only: the build and the embed floor are skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Links, tables and the hygiene grep on what the change adds
  # (scripts/docs-check.sh). Light; runs on every pull request.
  docs:
    name: Docs (links, tables, hygiene)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/docs-check.sh --base "${{ github.event.pull_request.base.sha }}"

  # Single full-graph validator on macOS (covers JVM/Android/JS/iOS).
  # Why no Linux: cheap-PR Linux runs hung at 58m on the cache restore step,
  # consistently. macOS already builds everything; one source of truth is
  # cheaper to maintain than a flaky two-runner setup.
  #
  # Runner selection is configurable via the `CI_RUNNER` repo variable
  # (Settings → Secrets and variables → Actions → Variables). Set it to
  # `self-hosted` to route runs to a self-hosted Mac and bypass GitHub
  # Actions billing — see docs/CI_RUNNER_SETUP.md. Default is `macos-latest`
  # (cloud) so the workflow keeps working on forks / contributor PRs.
  build:
    name: Build (full graph, incl. iOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # A pull request from a fork always builds on a hosted runner, so no outside
    # code reaches a self-hosted machine even if CI_RUNNER names one.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'macos-latest' }}
    # 90: calibrated against the self-hosted Mac at 30, then 60. On GitHub-hosted
    # macos-latest (CI_RUNNER) the full graph takes 50-60 minutes, and at 60 the
    # last test steps were cut off as "cancelled" again and again (2026-10-10/11,
    # e.g. runs 38151539258, 38151768857, 38155940708). They are free for public
    # repos, so a generous ceiling costs nothing; a tight one reads like someone
    # stopped the run. 150 since 2026-11-11: after Kotlin 2.4.20 and the JS/wasm test
    # step the job takes 85-100 minutes, and every build at 90 was cancelled in its
    # last step (e.g. runs 42886398822, 42886269065), main's included, so no cache was saved.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v4

      - name: Build + publishToMavenLocal (no signing)
        run: >
          ./gradlew
          publishToMavenLocal
          -x test
          -x allTests
          -DRELEASE_SIGNING_ENABLED=false

      # Guard the Compose-for-Web (Wasm) render target so it never silently
      # breaks. publishToMavenLocal above already compiles each library's
      # wasmJs klib; this compiles the generic web host (web-spike), which
      # transitively links the whole render chain to wasm — the part not
      # covered by publishing. See docs/WEB_SPIKE_FINDINGS.md.
      - name: Compile Compose-for-Web (Wasm) host
        run: >
          ./gradlew
          :web-spike:compileKotlinWasmJs
          -DRELEASE_SIGNING_ENABLED=false

      # The tools bundle's GENERIC editor is the same module built with
      # -Pkeliver.genericEditor=true (another source dir: no compiled component
      # adapters). Compile it here too, so a break shows before a tools build.
      - name: Compile the tools bundle's generic editor (Wasm)
        run: >
          ./gradlew
          -Pkeliver.genericEditor=true
          :web-spike:compileKotlinWasmJs
          -DRELEASE_SIGNING_ENABLED=false

      # Portal codegen staleness: the committed GeneratedCatalog/GeneratedExporter/
      # GeneratedRenderNode must match what the schemas produce. Regenerate with
      # `./gradlew :portal-schema-codegen:generatePortalCode` and commit.
      - name: Portal generated code is fresh
        run: >
          ./gradlew
          :portal-schema-codegen:checkPortalCode
          -DRELEASE_SIGNING_ENABLED=false

      # Gate A prototype (docs/COMPOSE_GENERATOR_DESIGN.md): the generated group's checked-in
      # sources and lock must match a fresh generation from Compose, and the lock may only grow.
      # Regenerate with `./gradlew :keliver-compose-generator:generateComposeApi` and commit.
      - name: Compose-generated group is fresh
        run: >
          ./gradlew
          :keliver-compose-generator:checkComposeApi
          :keliver-compose-generator:test
          :keliver-compose-values:jvmTest
          :keliver-compose-values:jsTest
          :keliver-compose-gatea-composeui:jvmTest
          -DRELEASE_SIGNING_ENABLED=false

      # Compiled component preview: the dogfood editor's adapters file must be
      # what the relay would write (docs/COMPILED_COMPONENT_PREVIEW.md).
      - name: Compiled component adapters are fresh
        run: >
          ./gradlew
          :portal-relay:compiledComponentAdapters
          -Pcheck
          -DRELEASE_SIGNING_ENABLED=false

      # The bundled screen/component scaffolders write into the app they are
      # run from, never beside the script (they once wrote into the tools
      # bundle). Shell only; a few seconds.
      - name: Scaffolders write into the app
        run: scripts/keliver-new-scaffolders-selftest.sh "$RUNNER_TEMP/scaffolders"

      # keliver-run-android.sh against a small relay and adb/gradlew stand-ins:
      # what it asks of the device and the build, and what it refuses. Seconds.
      - name: keliver-run-android (no device)
        run: scripts/keliver-run-android-selftest.sh "$RUNNER_TEMP/run-android"

      # Enforce the test suite + API binary-compatibility surface.
      # Previously skipped (-x test), which let a stripped test
      # fixture rot the suite undetected — see docs/KNOWN_BUGS.md U13.
      # `apiCheck` guards the published API against accidental drift;
      # the per-module `.api` baselines under `*/api/` are the source
      # of truth (regenerate with `./gradlew apiDump` when you
      # intentionally change public API).
      #
      # ANDROID_HOME is pre-set on GitHub macOS runners; the gradle-
      # plugin lint fixtures (FixtureTest > lintMpp*) spin up a
      # sub-build with an Android module and need it.
      - name: Test + API check
        run: >
          ./gradlew
          test
          apiCheck
          -DRELEASE_SIGNING_ENABLED=false

      # The `test` aggregate above only reaches projects that HAVE a `test`
      # task — i.e. the `kotlin.jvm` ones (portal-ingest, portal-relay,
      # portal-schema-codegen). Every multiplatform portal module registers
      # `jsTest`/`wasmJsTest`/`jvmTest` instead and NO `test`, so Gradle
      # silently skipped them: `:portal-render:test` fails with "task 'test'
      # not found in project ':portal-render'".
      #
      # That meant the two suites that guard the riskiest invariants had never
      # run in CI:
      #   - portal-render wasmJsTest = the K1 preview-vs-device parity gates
      #     (Repeat/Condition/modifiers/action wiring). This is what catches a
      #     regression of the wrapper-Column bug that made forEach rows
      #     wrap-content in the editor but fill-width on device.
      #   - portal-document = the UiDocument apply/invert engine behind
      #     portal write-back to canonical .kt files.
      #
      # List the tasks EXPLICITLY. Do not "simplify" this to `allTests`: that
      # also drags in the gated test-app JS modules, whose npm dependency
      # superset conflicts with the strict yarn.lock check in the build above.
      # The composeui jvmTests are the widgets' real Compose UI tests (desktop,
      # headless: HostGapsTest, LazyListItemStateTest). Like the portal modules,
      # `test` skips them. keliver-bridge's guard runs on JVM, JS and the iOS
      # simulator (docs/BRIDGE_CODEGEN_DESIGN.md, section 6). It is this job's
      # first iOS simulator test: it needs Xcode's simulators on the runner and
      # adds a Native test link (about a minute) to the job's time.
      # keliver-bridge-fixture is a contract module built with keliver-bridge-codegen and
      # the Zipline plugin; it is not published, so the build above does not compile it. Its
      # jvmTest also builds keliver-bridge-fixture-guest (a Kotlin/JS Zipline guest) and runs
      # the first guest-to-host round trip through it (B5b).
      - name: Test (portal multiplatform modules)
        run: >
          ./gradlew
          :portal-render:wasmJsTest
          :portal-render:jsTest
          :portal-document:jvmTest
          :portal-document:jsTest
          :portal-editor:wasmJsTest
          :portal-app-lib:wasmJsTest
          :portal-sql:jvmTest
          :keliver-material-composeui:jvmTest
          :keliver-lazylayout-composeui:jvmTest
          :keliver-bridge:jvmTest
          :keliver-bridge:jsTest
          :keliver-bridge:iosSimulatorArm64Test
          :keliver-bridge-fixture:jvmTest
          :keliver-bridge-fixture:compileKotlinJs
          :keliver-bridge-fixture:compileKotlinIosSimulatorArm64
          :keliver-bridge-fixture:ziplineApiCheck
          -DRELEASE_SIGNING_ENABLED=false

      # Every library's Kotlin/JS and wasm tests. Linking a test EXECUTABLE is the only place a
      # klib ABI mismatch shows up (coroutines 1.9.0 against the Kotlin 2.4 stdlib broke
      # keliver-runtime, keliver-lazylayout-api and keliver-nav while their library compiles
      # passed). Kotlin/JS tests are cheap. Left out, each already failing for a reason of its
      # own: keliver-widget-composeui:jsTest and keliver-widget/-widget-composeui:wasmJsTest
      # (skiko.mjs is not packaged for the test runner) and keliver-leak-detector:wasmJsTest (docs/KNOWN_BUGS.md U41)
      # (commonTest `delayForGc` has no wasm actual).
      - name: Test (JS and wasm, all libraries)
        run: >
          ./gradlew --continue
          :keliver-bridge-annotations:jsTest :keliver-bridge-fixture:jsTest
          :keliver-bridge-fixture-guest:jsTest :keliver-capabilities:jsTest :keliver-compose:jsTest
          :keliver-composeui:jsTest :keliver-console:jsTest :keliver-guest:jsTest :keliver-http:jsTest
          :keliver-http-annotations:jsTest :keliver-layout-api:jsTest :keliver-layout-compose:jsTest
          :keliver-layout-composeui:jsTest :keliver-layout-modifiers:jsTest
          :keliver-layout-shared-test:jsTest :keliver-layout-testing:jsTest :keliver-layout-widget:jsTest
          :keliver-lazylayout-api:jsTest :keliver-lazylayout-compose:jsTest
          :keliver-lazylayout-composeui:jsTest :keliver-lazylayout-shared-test:jsTest
          :keliver-lazylayout-testing:jsTest :keliver-lazylayout-widget:jsTest :keliver-leak-detector:jsTest
          :keliver-material-api:jsTest :keliver-material-compose:jsTest :keliver-material-composeui:jsTest
          :keliver-material-modifiers:jsTest :keliver-material-protocol-guest-web:jsTest
          :keliver-material-protocol-host-web:jsTest :keliver-material-testing:jsTest
          :keliver-material-widget:jsTest :keliver-nav:jsTest :keliver-protocol:jsTest
          :keliver-protocol-guest:jsTest :keliver-protocol-host:jsTest :keliver-runtime:jsTest
          :keliver-snapshot-testing:jsTest :keliver-storage:jsTest :keliver-testing:jsTest
          :keliver-treehouse:jsTest :keliver-treehouse-guest:jsTest :keliver-treehouse-guest-compose:jsTest
          :keliver-ui-basic-api:jsTest :keliver-ui-basic-compose:jsTest :keliver-ui-basic-composeui:jsTest
          :keliver-ui-basic-modifiers:jsTest :keliver-ui-basic-testing:jsTest :keliver-ui-basic-widget:jsTest
          :keliver-vm:jsTest :keliver-widget:jsTest :keliver-widget-shared-test:jsTest
          :keliver-widget-testing:jsTest :keliver-yoga:jsTest :portal-core:jsTest :portal-device-guest:jsTest
          :portal-flow:jsTest :portal-published-guest:jsTest :portal-sql:jsTest :portal-sql-spike:jsTest
          :portal-app-lib:jsTest
          :keliver-capabilities:wasmJsTest :keliver-compose:wasmJsTest :keliver-composeui:wasmJsTest
          :keliver-layout-api:wasmJsTest :keliver-layout-compose:wasmJsTest
          :keliver-layout-composeui:wasmJsTest :keliver-layout-modifiers:wasmJsTest
          :keliver-layout-shared-test:wasmJsTest :keliver-layout-testing:wasmJsTest
          :keliver-layout-widget:wasmJsTest :keliver-lazylayout-api:wasmJsTest
          :keliver-lazylayout-compose:wasmJsTest :keliver-lazylayout-composeui:wasmJsTest
          :keliver-lazylayout-shared-test:wasmJsTest :keliver-lazylayout-testing:wasmJsTest
          :keliver-lazylayout-widget:wasmJsTest :keliver-material-api:wasmJsTest
          :keliver-material-compose:wasmJsTest :keliver-material-composeui:wasmJsTest
          :keliver-material-modifiers:wasmJsTest :keliver-material-protocol-guest-web:wasmJsTest
          :keliver-material-protocol-host-web:wasmJsTest :keliver-material-testing:wasmJsTest
          :keliver-material-widget:wasmJsTest :keliver-protocol:wasmJsTest :keliver-protocol-guest:wasmJsTest
          :keliver-protocol-host:wasmJsTest :keliver-runtime:wasmJsTest :keliver-snapshot-testing:wasmJsTest
          :keliver-testing:wasmJsTest :keliver-ui-basic-api:wasmJsTest :keliver-ui-basic-compose:wasmJsTest
          :keliver-ui-basic-composeui:wasmJsTest :keliver-ui-basic-modifiers:wasmJsTest
          :keliver-ui-basic-testing:wasmJsTest :keliver-ui-basic-widget:wasmJsTest
          :keliver-widget-shared-test:wasmJsTest :keliver-widget-testing:wasmJsTest :keliver-yoga:wasmJsTest
          :portal-core:wasmJsTest :portal-document:wasmJsTest :portal-flow:wasmJsTest
          :portal-presenter-spike:wasmJsTest :web-spike:wasmJsTest
          -DRELEASE_SIGNING_ENABLED=false

      # The full inherited Redwood test suite that asserts against the
      # recovered `test-app` fixture (gated behind -PkeliverWithTestApp;
      # see docs/KNOWN_BUGS.md U13). Both halves now run:
      #   - schema/codegen tests (protocol-host/-guest, testing, compose,
      #     tooling-codegen)
      #   - treehouse-host integration tests that load a live Zipline
      #     guest bundle via TreehouseTester (presenter-treehouse)
      #   - the guest-side jsTest
      # Targeted test tasks (not the `test` aggregate). The gated test-app JS
      # modules resolve a SUPERSET of npm deps (presenter-treehouse's dev server
      # pulls express/body-parser/etc.), so the committed kotlin-js-store/yarn.lock
      # — which matches, and is strictly checked by, the normal build above —
      # cannot also match this config. Regenerate the lock for THIS configuration
      # first (kotlinUpgradeYarnLock); the normal build keeps its strict
      # kotlinStoreYarnLock check, so real dependency drift is still caught there.
      - name: Test (recovered test-app fixture)
        run: |
          ./gradlew -PkeliverWithTestApp kotlinUpgradeYarnLock -DRELEASE_SIGNING_ENABLED=false
          ./gradlew \
            -PkeliverWithTestApp \
            :keliver-protocol-host:jvmTest \
            :keliver-protocol-guest:jvmTest \
            :keliver-testing:jvmTest \
            :keliver-compose:jvmTest \
            :keliver-tooling-codegen:test \
            :keliver-treehouse-host:jvmTest \
            :keliver-treehouse-guest:jsTest \
            -DRELEASE_SIGNING_ENABLED=false

  # K3: the dependency floor the embedded Android host imposes. Resolves the
  # --embed template's classpath, scaffolds it into an app on older libraries
  # (scripts/fixtures/embed-older-compose), checks the floor report the
  # scaffolder prints before writing, builds the app and compares what Gradle
  # resolved. Linux: ubuntu-latest has a JDK and an Android SDK.
  embed-floor:
    name: Embed dependency floor (older-libraries app)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Floor, report and consumer build
        run: scripts/keliver-embed-floor-check.sh "$RUNNER_TEMP/embed-floor"

  # The scaffolded production Android host, built from Maven Central with its
  # host-kit JVM tests (RequestPolicy, the app's own HostHttp client (B1),
  # ExternalLinkPolicy, KeliverRoute): keliver-new-production-host-selftest.sh
  # --build. portal-tools.yml runs the same at a tools build; this runs it on
  # pull requests that change the host, so a template change is tested
  # before it merges.
  production-host-build:
    name: Production host scaffold (build + JVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A pull request runs it when the host's templates, its scaffolder or
      # this workflow changed (the build starts from a cold Gradle home);
      # pushes to main and manual runs always do.
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          if grep -Eq '^scripts/(templates/production-host[^/]*/|keliver-new-production-host(-selftest)?\.sh$|keliver-test-isolation-guard\.sh$|keliver-store-path\.sh$)|^(gradlew|gradle/wrapper/.*|\.github/workflows/ci\.yml)$' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.paths.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Scaffold, build and test the production host
        if: steps.paths.outputs.run == 'true'
        run: scripts/keliver-new-production-host-selftest.sh "$RUNNER_TEMP/prod-host" --build

  # Which parts of the tree a pull request touches: the editor end-to-end suite
  # below runs only when the editor, what it renders with, or the relay it
  # talks to changed (every push to main and every manual run runs it).
  editor-e2e-changes:
    name: Editor E2E — changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          while IFS= read -r f; do echo "  $f"; done <<<"$changed"
          if grep -Eq '^(portal-[^/]+|keliver-[^/]+|web-spike|editor-e2e|gradle|build-support[^/]*|kotlin-js-store)/|^(build\.gradle|settings\.gradle|gradle\.properties|\.github/workflows/ci\.yml)$' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The web editor driven by REAL input (CDP mouse, wheel, keys and drag) in
  # headless Chrome against a scratch relay on the public fixture app
  # (editor-e2e/fixture): canvas selection of component instances, scrolling,
  # panels, undo/redo, palette drops, component editing, and byte-exact
  # write-back of every edit and its undo. editor-e2e/README.md says how to run
  # and extend it. Linux, like portal-tools.yml's editor build: ubuntu-latest has
  # Chrome, JDK and Node; no Gradle cache (the restore step hung Linux runs, see
  # the build job), so the editor and relay build from scratch.
  editor-e2e:
    name: Editor E2E (real input, headless Chrome)
    needs: editor-e2e-changes
    if: needs.editor-e2e-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chrome
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$chrome" --version
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Build the generic editor and the relay
        run: ./gradlew --console=plain -Pkeliver.genericEditor=true :web-spike:wasmJsBrowserDistribution :portal-relay:installDist -DRELEASE_SIGNING_ENABLED=false
      - name: Run the editor E2E suite
        run: editor-e2e/run.sh --no-build
        env:
          E2E_OUT: ${{ github.workspace }}/build/editor-e2e
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/editor-e2e
          retention-days: 14
