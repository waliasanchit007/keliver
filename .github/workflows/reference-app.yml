# The inventory reference app (reference/inventory). The app and its
# development route come from the PUBLISHED tools release and Maven Central.
# Its production hosts and its signed publishing are scaffolded by bin/ scripts
# and built against Maven Central; no Keliver library source is compiled.
#
# Whose scripts depends on the trigger (KELIVER_SCAFFOLD_FROM below):
# - run by hand: the release's own, so the run is a published-only proof;
# - a pull request: this checkout's scripts/, the change under review.
# Always this checkout's: ci/ and the isolation guard (the harness), and the
# app's overlay files (bootstrap.sh's hand edits).
#
# Checked on an emulator:
# - the development route and a D14 layout edit;
# - production OTA with app-owned disposable keys;
# - then the static route (W3-W6): keliver-publish into a static HTTPS server
#   with no relay, the embedded host (W2), updates and reports (W5, W6).
#
# This is dogfooding, not adoption: the app is ours.
#
# Read-only. Nothing here can create a release, attach an asset, publish a
# package or move a tag.
name: reference-app
# Runs on a pull request that touches the reference app or this workflow, and on
# demand. Not on push: it downloads a published release and boots an emulator,
# which is a check of the adopter route, not of every commit.
on:
  pull_request:
    # The production host's templates, the publishing route and keliver-publish
    # (W3) are what the emulator checks exercise, so changes to them run it too.
    paths:
      - "reference/**"
      - ".github/workflows/reference-app.yml"
      - "scripts/templates/production-host/**"
      - "scripts/templates/production-host-embed/**"
      - "scripts/templates/publish/**"
      - "scripts/keliver-new-production-host.sh"
      - "scripts/keliver-new-publish-target.sh"
      - "scripts/keliver-publish"
      - "scripts/keliver-publish-selftest.sh"
      - "portal-relay/src/main/kotlin/StaticIndex.kt"
      - "portal-relay/src/main/kotlin/KeliverPublish.kt"
      - "portal-relay/src/main/kotlin/PublishSignature.kt"
      - "portal-relay/src/main/kotlin/KeyRotation.kt"
  workflow_dispatch:
    inputs:
      device_route:
        # W7: physical rehearses the USB-phone route on this emulator: the hosts
        # are built for 127.0.0.1 behind adb reverse, and the HTTPS test APKs
        # carry the throwaway CA instead of the emulator's system store taking
        # it. A rehearsal of the harness, never a physical-device result.
        description: "emulator (default), or physical: rehearse the USB-phone route (docs/DEVICE_PROOF.md) on the emulator"
        type: choice
        options: [emulator, physical]
        default: emulator
      # D14's screenshot leg: every capture on aosp_atd with swiftshader_indirect
      # has been black (docs/REFERENCE_APP.md, "Device screenshots"). These try
      # other images and renderers by hand; pull requests keep the defaults.
      emulator_target:
        description: "system image (aosp_atd is CI's)"
        type: choice
        options: [aosp_atd, google_apis, default]
        default: aosp_atd
      emulator_gpu:
        description: "emulator -gpu mode (swiftshader_indirect is CI's)"
        type: choice
        options: [swiftshader_indirect, swangle_indirect, guest]
        default: swiftshader_indirect
permissions:
  contents: read
jobs:
  reference-app:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      # Which scaffolders and keliver-publish are under test. A pull request
      # tests ITS OWN scripts/ (repo): template changes are what it changes.
      # A run started by hand (workflow_dispatch) uses only the published zip's
      # bin/ (zip): the published-only proof of the release pinned below.
      # Everything else always comes from the published zip.
      KELIVER_SCAFFOLD_FROM: ${{ github.event_name == 'workflow_dispatch' && 'zip' || 'repo' }}
      # W7: the device route prepare.sh builds for (emulator on a pull request).
      KELIVER_DEVICE: ${{ inputs.device_route || 'emulator' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download the PUBLIC tools 0.3.14 release, as the adopter guide does
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$GITHUB_WORKSPACE/evidence"
          cd "$RUNNER_TEMP/dl"
          base=https://github.com/waliasanchit007/keliver/releases/download/portal-tools-v0.3.14
          curl -fsSLO "$base/keliver-portal-tools-0.3.14.zip"
          curl -fsSLO "$base/keliver-portal-tools-0.3.14.zip.sha256"
          {
            echo "downloaded: $base/keliver-portal-tools-0.3.14.zip"
            sha256sum -c keliver-portal-tools-0.3.14.zip.sha256
            sha256sum keliver-portal-tools-0.3.14.zip
            unzip -p keliver-portal-tools-0.3.14.zip 'keliver-portal-tools-0.3.14/VERSION.json'
          } | tee "$GITHUB_WORKSPACE/evidence/public-download.txt"
          test "$(sha256sum keliver-portal-tools-0.3.14.zip | cut -d' ' -f1)" = \
            7284aec9d45ea11a0b8c36863955a4f47c6df79c996be488922d3f092a24dc08
          unzip -p keliver-portal-tools-0.3.14.zip 'keliver-portal-tools-0.3.14/VERSION.json' \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['sourceCommit'] == '58851db260446445ae47ec09e7ac428695bf5a4f'"

      - name: Prepare — bootstrap, ingest, signed v1, scaffolded production host
        run: |
          bash reference/inventory/ci/prepare.sh "$RUNNER_TEMP/ref" "$GITHUB_WORKSPACE/evidence" \
            "$RUNNER_TEMP/dl/keliver-portal-tools-0.3.14.zip"
          # Free the app's Gradle daemon before the emulator starts.
          (cd "$RUNNER_TEMP/ref/boot/inventory" && ./gradlew --stop) || true

      # zip: the published zip's own bin/keliver-publish and relay/ (--package);
      # repo: the relay install prepare.sh built from this checkout.
      - name: keliver-publish self-test (W3), the zip's or this checkout's
        run: |
          set -o pipefail
          if [ "$KELIVER_SCAFFOLD_FROM" = zip ]; then
            under_test=(--package "$(dirname "$(ls -d "$RUNNER_TEMP"/ref/boot/tools/keliver-portal-tools-*/bin)")")
          else
            under_test=(--relay-home "$GITHUB_WORKSPACE/portal-relay/build/install/portal-relay")
          fi
          echo "under test: ${under_test[*]}"
          bash scripts/keliver-publish-selftest.sh "$RUNNER_TEMP/publish-selftest" "${under_test[@]}" \
            | tee "$GITHUB_WORKSPACE/evidence/keliver-publish-selftest.txt"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Emulator — development route, D14 edit, production OTA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: ${{ inputs.emulator_target || 'aosp_atd' }}
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu ${{ inputs.emulator_gpu || 'swiftshader_indirect' }}
          disable-animations: true
          script: bash reference/inventory/ci/device.sh "$RUNNER_TEMP/ref" "$GITHUB_WORKSPACE/evidence"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-app-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
