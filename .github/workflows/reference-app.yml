# The inventory reference app (reference/inventory). The app and its
# development route come from the PUBLISHED tools release and Maven Central.
# Its production host is built against Maven Central too — no Keliver library
# module is compiled from source — but it is scaffolded by this checkout's
# scripts/keliver-new-production-host.sh, whose templates (the host's own
# Kotlin) are not yet in a published tools bundle. ci/ and the isolation guard
# are this checkout's as well. Checked on an emulator: the development route, a D14 layout edit, and
# production OTA with app-owned disposable keys. Then W3: keliver-publish (built
# from this checkout) into a static HTTPS server, with no relay.
#
# This is dogfooding, not adoption: the app is ours.
#
# Read-only. Nothing here can create a release, attach an asset, publish a
# package or move a tag.
name: reference-app
# Runs on a pull request that touches the reference app or this workflow, and on
# demand. Not on push: it downloads a published release and boots an emulator,
# which is a check of the adopter route, not of every commit.
on:
  pull_request:
    # The production host's templates, the publishing route and keliver-publish
    # (W3) are what the emulator checks exercise, so changes to them run it too.
    paths:
      - "reference/**"
      - ".github/workflows/reference-app.yml"
      - "scripts/templates/production-host/**"
      - "scripts/templates/publish/**"
      - "scripts/keliver-new-production-host.sh"
      - "scripts/keliver-new-publish-target.sh"
      - "scripts/keliver-publish"
      - "scripts/keliver-publish-selftest.sh"
      - "portal-relay/src/main/kotlin/StaticIndex.kt"
      - "portal-relay/src/main/kotlin/KeliverPublish.kt"
      - "portal-relay/src/main/kotlin/PublishSignature.kt"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reference-app:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download the PUBLIC tools 0.3.5 release, as the adopter guide does
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl" "$GITHUB_WORKSPACE/evidence"
          cd "$RUNNER_TEMP/dl"
          base=https://github.com/waliasanchit007/keliver/releases/download/portal-tools-v0.3.5
          curl -fsSLO "$base/keliver-portal-tools-0.3.5.zip"
          curl -fsSLO "$base/keliver-portal-tools-0.3.5.zip.sha256"
          {
            echo "downloaded: $base/keliver-portal-tools-0.3.5.zip"
            sha256sum -c keliver-portal-tools-0.3.5.zip.sha256
            sha256sum keliver-portal-tools-0.3.5.zip
            unzip -p keliver-portal-tools-0.3.5.zip 'keliver-portal-tools-0.3.5/VERSION.json'
          } | tee "$GITHUB_WORKSPACE/evidence/public-download.txt"
          test "$(sha256sum keliver-portal-tools-0.3.5.zip | cut -d' ' -f1)" = \
            4e1c3040c2e069ab2a503f4b45a7740a28ac243edfb233cdffc7bcb7e7eeb439
          unzip -p keliver-portal-tools-0.3.5.zip 'keliver-portal-tools-0.3.5/VERSION.json' \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['sourceCommit'] == 'b5615637531127c1d408fe0f7d652cac044d2930'"

      - name: Prepare — bootstrap, ingest, signed v1, scaffolded production host
        run: |
          bash reference/inventory/ci/prepare.sh "$RUNNER_TEMP/ref" "$GITHUB_WORKSPACE/evidence" \
            "$RUNNER_TEMP/dl/keliver-portal-tools-0.3.5.zip"
          # Free the app's Gradle daemon before the emulator starts.
          (cd "$RUNNER_TEMP/ref/boot/inventory" && ./gradlew --stop) || true

      - name: keliver-publish self-test (W3), against the relay install prepare.sh built
        run: |
          set -o pipefail
          bash scripts/keliver-publish-selftest.sh "$RUNNER_TEMP/publish-selftest" \
            --relay-home "$GITHUB_WORKSPACE/portal-relay/build/install/portal-relay" \
            | tee "$GITHUB_WORKSPACE/evidence/keliver-publish-selftest.txt"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Emulator — development route, D14 edit, production OTA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash reference/inventory/ci/device.sh "$RUNNER_TEMP/ref" "$GITHUB_WORKSPACE/evidence"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-app-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
