import dev.keliver.buildsupport.WasmJs
import static dev.keliver.buildsupport.TargetGroup.Common

redwoodBuild {
  targets(Common + WasmJs.Browser) // the editor canvas (ED0 spike)
  // Prototype only (no API dump, no explicitApi history): local Maven at most. NEVER pass
  // -PkeliverComposePrototype to the Central publish workflow (publish-maven-central.yml).
  if (rootProject.hasProperty('keliverComposePrototype')) publishing()
}

apply plugin: 'dev.keliver.generator.protocol.host'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverComposeGateaWidget
        api projects.keliverComposeGateaModifiers
        api projects.keliverMaterialModifiers
        implementation projects.keliverProtocolHost
      }
    }
  }
}

redwoodSchema {
  source = projects.keliverComposeGateaSchema
  type = 'dev.keliver.compose.gatea.KeliverComposeGateA'
  // NF5 A1: the review list (KeliverComposeGateAFrameRules.review.txt, the values a Shell frame
  // keeps) is checked in and must match; regenerate it with redwoodFrameRulesGenerate.
  frameRules { strict = true }
}
