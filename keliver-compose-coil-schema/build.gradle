// The product's generated coil group (docs/MS4_PLAN.md, MS4-03; Q1: coil is optional): its Redwood
// schema, Coil's `AsyncImage`. src/main/kotlin/…/Generated.kt and coil.editor.json are written by
// :keliver-compose-generator:generateComposeApi (from coil.json and coil.lock.json). The root lists it
// as a dependency at tag 17; a host that ships no Coil leaves the group out (keliverComposeWidgetSystem()).
import static dev.keliver.buildsupport.TargetGroup.Tooling

redwoodBuild {
  targets(Tooling)
  publishing()
}

apply plugin: 'dev.keliver.schema'

dependencies {
  api projects.keliverComposeValues
}

redwoodSchema {
  type = 'dev.keliver.compose.coil.KeliverComposeCoil'
}

// The generator writes Generated.kt and the staleness guard compares it byte for byte: no spotless.
afterEvaluate {
  spotless {
    kotlin {
      targetExclude("src/**/Generated.kt")
    }
  }
}
