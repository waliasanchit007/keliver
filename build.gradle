// ---------------------------------------------------------------------------
// The one store contract. The relay generates the portal's Ed25519 keys under
// the repo's resolved document store; the publisher signs with the private key
// and the device hosts embed the public one. They used to hardcode
// ~/.keliver-portal, which broke the moment the relay moved to a per-app store:
// a bundle signed by one identity, verified against another. Everything now
// asks scripts/keliver-store-path.sh, and StoreContractTest asserts that script
// agrees with PortalConfig.storeDir().
// ---------------------------------------------------------------------------
// WHEN this runs matters as much as what it answers. Resolution used to happen
// while each consumer's build file was being EVALUATED, and Gradle evaluates
// every project for any task, so a resolver that could not answer failed the
// WHOLE build — :portal-relay:test, apiCheck, tasks with no signing identity
// anywhere in them. Failing closed is right; failing unrelated work is not.
// Each consumer now wires this into a Provider queried by the one task that
// needs the key, so the resolver runs, and can refuse, only when the selected
// operation actually depends on this app's identity.
//
// Memoised for the build: three consumers querying lazily would otherwise spawn
// the resolver subprocess once per query rather than once per build. A FAILURE
// is memoised too and rethrown, so the diagnostic is identical wherever it
// surfaces and a broken resolver is not re-run dozens of times.
ext.keliverStoreMemo = [:]

// The deliberate escape, for all three consumers rather than only the Android
// one. Resolution FAILS rather than falling back, so this gives a way to
// proceed on purpose. It is NOT equivalent to the resolver's steps 1 and 2:
// PORTAL_STORE and "store" are honoured by the relay as well, whereas this is a
// GRADLE property only the build sees. Sign with it and the publisher uses one
// identity while the relay serves whatever the resolver selects — which is the
// mismatch the contract exists to prevent — unless PORTAL_STORE or "store" is
// set to agree. It also returns before keliverStoreDir, so it bypasses the
// split refusal (exit 3). Strictly better than the silent ~/.keliver-portal
// fallback it replaced, but it is an override, so it says so. The warning is a
// WARNING: it reports that the build's identity may differ from the relay's, it
// does not check that they agree, and nothing here can make it proof that they
// do.
ext.keliverPortalStore = { org.gradle.api.Project p ->
  def memo = rootProject.ext.keliverStoreMemo
  def override = p.findProperty('keliver.portalStore')
  if (override) {
    // quiet(), not lifecycle(): -q hides lifecycle, and -q is how
    // keliver-device-host-hygiene-check.sh — the ONLY scripted caller that
    // passes this property; build-portal-tools.sh passes devOnlyHost only —
    // invokes Gradle, so the warning was never shown there. Surviving -q is
    // not the same as being read: that script redirected the build log and
    // only looked at it on failure, so it now greps for this line and asserts
    // it. Printed once per build, not once per lazy query.
    synchronized (memo) {
      if (!memo.containsKey('warned')) {
        memo.put('warned', true)
        p.logger.quiet("keliver: -Pkeliver.portalStore=${override} is in use, so this build signs " +
          'and embeds from that store. The RELAY will not use it unless PORTAL_STORE or "store" in ' +
          'keliver.portal.json names it too — otherwise the bundle is signed by one identity and ' +
          'verified against another. This is a warning, not a check: nothing here verifies that ' +
          'the relay agrees.')
      }
    }
    return new java.io.File(override.toString())
  }
  def answer
  synchronized (memo) {
    if (!memo.containsKey('store')) {
      try {
        memo.put('store', keliverStoreDir(p.rootProject.projectDir))
      } catch (Throwable t) {
        memo.put('store', t)
      }
    }
    answer = memo.get('store')
  }
  if (answer instanceof Throwable) throw answer
  return answer
}

// The lazy form every consumer should use: nothing resolves until the returned
// provider is queried, which happens when the task that needs the key is run.
ext.keliverPortalStoreProvider = { org.gradle.api.Project p ->
  p.providers.provider { keliverPortalStore(p) }
}

ext.keliverStoreDir = { java.io.File repoDir ->
  def script = new java.io.File(rootProject.projectDir, 'scripts/keliver-store-path.sh')
  if (!script.exists()) {
    throw new GradleException("keliver: ${script} is missing, so this app's store cannot be " +
      'resolved. The publisher signs with the key in that store and the device hosts embed ' +
      'its public key; guessing would sign with one identity and verify against another.')
  }
  def out = new StringBuilder(), err = new StringBuilder()
  def proc = [script.absolutePath, repoDir.absolutePath].execute()
  proc.consumeProcessOutput(out, err)
  proc.waitForOrKill(30_000)
  def path = out.toString().trim()
  // Exit 3 is "this app has more than one store and I will not guess" (U25.1).
  // Falling back to ~/.keliver-portal there would sign the guest bundle with
  // whatever identity the legacy global store happens to hold — the exact
  // mismatch this resolver exists to prevent. Refuse instead.
  if (proc.exitValue() == 3) {
    throw new GradleException('keliver: ' + err.toString().trim())
  }
  // NO FALLBACK. This used to warn and return ~/.keliver-portal — the legacy
  // GLOBAL store, which on a developer's machine usually holds a real signing
  // identity. Measured: with python3 off the PATH, a per-app store of
  // apps/probeapp-bce953ee silently became ~/.keliver-portal, so the guest
  // bundle would be signed by one identity while the relay served another.
  // A warning in a -q build is not a defence. Fail, and say what to do.
  if (proc.exitValue() != 0 || path.isEmpty()) {
    throw new GradleException("keliver: could not resolve this app's portal store.\n" +
      "  resolver: ${script}\n" +
      "  exit:     ${proc.exitValue()}\n" +
      "  stderr:   ${err.toString().trim() ?: '(none)'}\n" +
      '  The resolver needs java and python3 on PATH. Refusing to fall back to\n' +
      '  ~/.keliver-portal: signing with whatever identity the legacy global store\n' +
      '  happens to hold is the mismatch this resolver exists to prevent.')
  }
  return new java.io.File(path)
}

buildscript {
  dependencies {
    classpath libs.kotlin.composePlugin
    classpath libs.kotlin.serializationPlugin
    classpath libs.atomicFuPlugin
    classpath libs.buildConfigPlugin
    classpath libs.burst.gradle.plugin
    classpath libs.zipline.gradlePlugin
    classpath libs.paparazzi.gradlePlugin
    classpath libs.poko.gradlePlugin
    classpath libs.jetbrains.compose.gradlePlugin
    classpath 'dev.keliver.build:gradle-plugin'
    classpath 'dev.keliver:keliver-gradle-plugin'
  }
  repositories {
    mavenCentral()
    google()
    gradlePluginPortal()
  }
}

apply plugin: 'org.jetbrains.dokka'

afterEvaluate {
  spotless {
    kotlin {
      targetExclude(
        // Apache 2-licensed files from AOSP.
        "build-support/src/main/resources/dev/keliver/buildsupport/composeHelpers.kt",
      )
    }
  }
}
