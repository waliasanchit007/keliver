import dev.keliver.buildsupport.WasmJs
import static dev.keliver.buildsupport.TargetGroup.ToolkitComposeUi

redwoodBuild {
  targets(ToolkitComposeUi + WasmJs.Browser)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'app.cash.paparazzi'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverMaterialWidget
        api libs.coil.compose
        api libs.jetbrains.compose.material
        api libs.jetbrains.compose.material.icons.core // Icon widget's curated name map
        implementation libs.jetbrains.compose.material.icons.extended // P1-6: expanded curated map
        api libs.jetbrains.compose.material3
        implementation projects.keliverLayoutComposeui
        implementation projects.keliverLazylayoutComposeui
        implementation projects.keliverWidgetComposeui
        implementation libs.jetbrains.compose.ui
      }
    }
    androidUnitTest {
      dependencies {
        implementation libs.kotlin.test.junit
      }
    }
    // Real Compose UI tests (sheets, themes, layout) on the desktop JVM, where Compose runs
    // headless without an emulator or Robolectric (which would clash with Paparazzi above).
    jvmTest {
      dependencies {
        implementation libs.kotlin.test
        implementation libs.jetbrains.compose.ui.test
        implementation rootProject.ext.skikoHostRuntime()
      }
    }
  }
}

android {
  namespace 'dev.keliver.material.composeui'

  buildFeatures {
    // For Paparazzi, which internally uses resources to set itself up.
    androidResources = true
  }
}

