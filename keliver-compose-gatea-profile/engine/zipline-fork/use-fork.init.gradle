// NF2: points a Keliver build at the forked Zipline JVM artifacts (README.md here), without
// changing the build. Two are replaced: `app.cash.zipline:zipline-jvm`, the JNI engine the
// bytecode compiler (zipline-cli, which the Zipline Gradle plugin runs) and the JVM hosts load, and
// (step 1b) `app.cash.zipline:zipline-bytecode`, through which the compiler applies source maps
// and strips line numbers, now in QuickJS 2026's bytecode (version 5). Every other Zipline module
// stays 1.28.0 from Maven Central.
//
//   ./gradlew -I keliver-compose-gatea-profile/engine/zipline-fork/use-fork.init.gradle \
//     -PziplineForkRepo=<the scratch Maven repo `apply.sh publish` wrote> --no-daemon <tasks>
//
// -PziplineForkRepo=none keeps Zipline 1.28.0: the baseline for a measurement of the fork. Both
// are built as Keliver builds, with source maps (step 1 turned them off on both until 1b).
// -PziplineForkNoSourceMaps turns the production link's source maps off again, on either.
//
// --no-daemon: the plugin loads the engine's native library into the Gradle process, so a daemon
// that already loaded 1.28.0's must not be reused.
// Included builds (build-support) run this script too; only the root build needs the fork.
if (gradle.parent != null) return
def forkRepo = startParameter.projectProperties['ziplineForkRepo']
if (forkRepo == null) throw new GradleException('use-fork.init.gradle: pass -PziplineForkRepo=<maven repo dir> (or none)')
def useFork = forkRepo != 'none'
def noSourceMaps = startParameter.projectProperties.containsKey('ziplineForkNoSourceMaps')
def forkVersion = '1.28.0-q20260604'
def upstreamVersion = '1.28.0'
def forkedModules = ['zipline-jvm', 'zipline-bytecode']

def addRepo = { RepositoryHandler repos ->
  repos.maven {
    name = 'ziplineFork'
    url = new File(forkRepo).toURI()
    content {
      forkedModules.each { includeVersion('app.cash.zipline', it, forkVersion) }
    }
  }
}
def substitute = { ConfigurationContainer configurations ->
  configurations.configureEach { c ->
    c.resolutionStrategy.eachDependency { d ->
      if (d.requested.group != 'app.cash.zipline') return
      if (d.requested.name in forkedModules) {
        d.useVersion(forkVersion)
        d.because('NF2: Zipline on QuickJS 2026-06-04')
      } else if (d.requested.version == forkVersion) {
        // The fork's own module metadata names its siblings at the fork version.
        d.useVersion(upstreamVersion)
      }
    }
  }
}

if (useFork) {
  settingsEvaluated { settings ->
    addRepo(settings.dependencyResolutionManagement.repositories)
  }
}
allprojects { p ->
  if (useFork) {
    addRepo(p.buildscript.repositories)
    substitute(p.buildscript.configurations)
    substitute(p.configurations)
  }
  // Zipline's compiler rewrites the bytecode itself when a .js.map is present (source lines into
  // the bytecode) or line numbers are stripped, through zipline-bytecode, which the fork has ported
  // to version 5 (step 1b), so source maps stay on. -PziplineForkNoSourceMaps turns them off, as
  // step 1 had to: debug information only, the code is the same.
  if (noSourceMaps) {
    p.tasks.configureEach { t ->
      if (t.name.startsWith('compileProductionExecutableKotlinJs') && t.hasProperty('compilerOptions')) {
        t.compilerOptions.sourceMap.set(false)
      }
    }
  }
}
