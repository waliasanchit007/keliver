// Gate A prototype (docs/COMPOSE_GENERATOR_DESIGN.md §4, §6): the guest's mirrors of Compose's value
// types (Dp, Color, Shape, TextStyle, Alignment, …) with their wire codecs, written by hand once, and
// (GeneratedDefaults.kt, Gate B) the `*Defaults` objects and factory-made types the generator mirrors.
// Published only with -PkeliverComposePrototype (never by a normal release).
import dev.keliver.buildsupport.WasmJs
import static dev.keliver.buildsupport.TargetGroup.Common

redwoodBuild {
  // wasmJs: the editor's canvas (ED0 spike, docs/ED0_SPIKE.md) decodes values with these codecs.
  targets(Common + WasmJs.Browser)
  // Prototype only (no API dump, no explicitApi history): local Maven at most. NEVER pass
  // -PkeliverComposePrototype to the Central publish workflow (publish-maven-central.yml).
  if (rootProject.hasProperty('keliverComposePrototype')) publishing()
}

apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverRuntime
        api libs.jetbrains.compose.runtime
        // rememberLazyListState saves its position, as Compose's does (LazyListState.Saver).
        api libs.jetbrains.compose.runtime.saveable
        api libs.kotlinx.serialization.json
        // Otherwise compose-runtime brings coroutines 1.9.0, whose JS klib fails to link against
        // Kotlin 2.4's stdlib (SubclassOptInRequired's constructor changed).
        api libs.kotlinx.coroutines.core
      }
    }
    commonTest {
      dependencies {
        implementation libs.kotlin.test
      }
    }
  }
}

// GeneratedDefaults.kt (the `*Defaults` mirrors and factory-made types) is written by
// :keliver-compose-generator:generateComposeApi and compared byte for byte: no spotless.
afterEvaluate {
  spotless {
    kotlin {
      targetExclude("src/**/GeneratedDefaults.kt")
    }
  }
}
