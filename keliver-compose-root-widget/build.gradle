// The product's generated root (docs/MS4_PLAN.md, MS4-01): its widget system, which takes one factory
// per generated group.
import dev.keliver.buildsupport.WasmJs
import static dev.keliver.buildsupport.TargetGroup.Common

redwoodBuild {
  targets(Common + WasmJs.Browser) // wasmJs: the editor canvas (ED0)
  publishing()
}

apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'dev.keliver.generator.widget'

kotlin {
  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverComposeCoreWidget
        // The coil group's widget interfaces (small, no Coil): the root lists every group, and a
        // host without keliver-compose-coil-composeui leaves the group absent (MS4-03).
        api projects.keliverComposeCoilWidget
      }
    }
  }
}

redwoodSchema {
  source = projects.keliverComposeRootSchema
  type = 'dev.keliver.compose.root.KeliverCompose'
}
