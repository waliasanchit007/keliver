// spike/keliver-web portal P4 — the PUBLISHED guest template. The publish step
// (portal-server POST /publish) writes generated/PublishedScreen.kt +
// PublishedEntry.kt into this module, compiles it to a .zipline bundle, and
// SIGNS the manifest with the portal's Ed25519 key from THIS repo's resolved
// document store (scripts/keliver-store-path.sh — the one store contract).
// Engineers own src/jsMain/kotlin/impl/ (bindings impls) — the round-trip
// boundary enforced at compile time. Service names match portal-device-guest,
// so the SAME host app loads either bundle (dev interpreter vs published).
apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'app.cash.zipline'

redwoodBuild {
  ziplineApplication('portal-published')
}

kotlin {
  js {
    outputModuleName = 'portal-published-guest'
    browser()
    binaries.executable()
  }

  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverTreehouse
        api libs.zipline
      }
    }
    jsMain {
      dependencies {
        api projects.keliverTreehouseGuest
        implementation projects.portalDeviceGuest          // HostApi / PortalPresenter interfaces
        implementation projects.keliverMaterialProtocolGuestWeb      // KeliverMaterialProtocolWidgetSystemFactory
        implementation projects.portalAppLib               // canonical screens/ + logic/ + PublishedEntry
        implementation projects.portalSql                  // M7: HostSqlDriver wire
        implementation libs.jetbrains.compose.runtime
        implementation libs.kotlinx.coroutines.core
      }
    }
  }
}

// SIGNING. Sign with the portal's key when it exists (generated by the relay at
// first boot). Absent key (fresh checkout / CI) -> unsigned dev bundle.
//
// The store used to be hardcoded to ~/.keliver-portal. Once the relay moved to
// a per-app store, this module kept signing with the OLD global key while the
// hosts embedded whichever public key they found — a bundle signed by one
// identity and verified against another. All of them now ask the same resolver
// (keliverPortalStore), and nothing asks it until a bundle is being compiled:
//
//   resolver answers + key present -> signed with THIS app's identity
//   resolver answers + no key      -> unsigned dev bundle
//   resolver cannot answer         -> the compile task fails, saying why
//
// The third case must not degrade to the second. "I could not find out whether
// you have a signing key" is not "you have no signing key".
//
// NOT THROUGH ZIPLINE'S signingKeys (U31, docs/KNOWN_BUGS.md). This used to set
// the compile task's signingKeys. Zipline hands each key to a child JVM as
// `--sign <alg>:<name>:<private key hex>`, so the key was on a command line any
// local user could read while it ran, printed in full by `--info`, and stored —
// it is an @Input — in .gradle/<version>/executionHistory/executionHistory.bin,
// mode 0644. Now the compile task runs unsigned and its last action signs the
// manifest it wrote, in this Gradle process, with Zipline's own ManifestSigner.
// The task's only key-related input is a one-way id (SHA-256) of the key, so a
// changed key still rebuilds the bundle. The same scheme is what
// scripts/templates/publish/signing.gradle writes into adopters' apps.
//
// The old wiring had an ordering rule (it had to sit below `kotlin {}`, or the
// plugin's own write won and the bundle shipped unsigned without an error).
// That rule is gone with signingKeys: configureEach reaches tasks registered
// later, and nothing overwrites a doLast. scripts/keliver-guest-signing-check.sh
// still asserts both directions, signed and unsigned.
def keliverGuestSigningKey = { ->
  def portalKey = new File(keliverPortalStore(project), 'keys/ed25519.priv')
  portalKey.exists() ? portalKey : null
}.memoize()
tasks.withType(app.cash.zipline.gradle.ZiplineCompileTask).configureEach { compileTask ->
  compileTask.inputs.property('keliverSigningKeyId', providers.provider {
    def key = keliverGuestSigningKey()
    if (key == null) return 'unsigned'
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    digest.update('keliver-signing-key-id\n'.getBytes('UTF-8'))
    digest.update(key.text.trim().getBytes('UTF-8'))
    digest.digest().encodeHex().toString()
  })
  compileTask.doLast {
    def key = keliverGuestSigningKey()
    if (key == null) return
    def manifestFile = new File(compileTask.outputDir.get().asFile, 'manifest.zipline.json')
    if (!manifestFile.isFile()) throw new GradleException("keliver: ${compileTask.path} wrote no ${manifestFile} to sign")
    def hex = key.text.trim()
    // Checked before decoding: okio's error for a malformed string quotes all of it.
    if (!(hex ==~ /[0-9a-fA-F]{64}/)) throw new GradleException("keliver: ${key} is not a 64-hex-digit Ed25519 private key (its content is not shown)")
    def signer = new app.cash.zipline.loader.ManifestSigner.Builder()
      .addEd25519('portal-ed25519', okio.ByteString.decodeHex(hex))
      .build()
    // The Kotlin companion object (Groovy would take `.Companion` for the nested class).
    def manifest = app.cash.zipline.ZiplineManifest.getField('Companion').get(null).decodeJson(manifestFile.text)
    manifestFile.text = signer.sign(manifest).encodeJson()
  }
}
