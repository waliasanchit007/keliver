// spike/keliver-web portal P4 — the PUBLISHED guest template. The publish step
// (portal-server POST /publish) writes generated/PublishedScreen.kt +
// PublishedEntry.kt into this module, compiles it to a .zipline bundle, and
// SIGNS the manifest with the portal's Ed25519 key from THIS repo's resolved
// document store (scripts/keliver-store-path.sh — the one store contract).
// Engineers own src/jsMain/kotlin/impl/ (bindings impls) — the round-trip
// boundary enforced at compile time. Service names match portal-device-guest,
// so the SAME host app loads either bundle (dev interpreter vs published).
apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'app.cash.zipline'

redwoodBuild {
  ziplineApplication('portal-published')
}

// Sign with the portal's key when it exists (generated by portal-server at
// first boot). Absent key (fresh checkout / CI) -> unsigned dev bundle.
//
// The store used to be hardcoded to ~/.keliver-portal. Once the relay moved to
// a per-app store, this module kept signing with the OLD global key while the
// hosts embedded whichever public key they found — a bundle signed by one
// identity and verified against another. All of them now ask the same resolver.
//
// This is the one consumer whose decision — sign, or ship unsigned — could not
// be made lazily through the `zipline { signingKeys { ... } }` extension: a key
// is either IN that container or not, and membership is fixed while this file
// is read. Asking the resolver there made an unanswerable store fail every task
// in the build. So the wiring goes one level down instead, onto the compile
// task's own ListProperty, which the plugin itself populates through a lazy
// provider chain (ZiplineCompileTask.configure -> project.provider { ... }
// .flatMap). Setting it here replaces that provider with one of ours, and
// nothing queries it until a bundle is actually being compiled:
//
//   resolver answers + key present -> signed with THIS app's identity
//   resolver answers + no key      -> empty list, unsigned dev bundle
//   resolver cannot answer         -> the compile task fails, saying why
//
// The third case must not degrade to the second. "I could not find out whether
// you have a signing key" is not "you have no signing key", and silently
// shipping an unsigned bundle to someone who signs theirs is the failure this
// contract exists to prevent.
// The ordering here is load-bearing, and it took three attempts to describe
// correctly, so: the zipline plugin writes signingKeys from the compile task's
// own REGISTRATION action, and Gradle runs that action LAST — after every
// `configureEach`/`all` action added before the task is realized, whenever those
// were added. A lazy `configureEach` therefore always loses, whether it was
// added before or after the task existed. MEASURED in this build: script level
// -> unsigned.signatures = {} with a key present.
//
// `configureEach` on an ALREADY-REALIZED task runs immediately instead, i.e.
// after the registration action, which is the only reason an afterEvaluate
// block worked: the zipline plugin's own afterEvaluate — registered at `apply
// plugin` above, so ahead of this file's — has already realized the task.
//
// Depending on that is depending on someone else realizing it for us: a plugin
// upgrade that stops doing so would drop signing silently, with NOBODY writing
// signingKeys. So the realization is not left to chance — `.toList()` forces it
// here, and the write provably follows it.
//
// It is still a fragile shape, so it is GATED rather than trusted:
// scripts/keliver-guest-signing-check.sh builds against a disposable store with
// a key and asserts the manifest is signed, and against one without and asserts
// it is not. It runs in the portable CI checks. Measured: reverting this to a
// lazy configureEach makes that check fail while the build still succeeds.
afterEvaluate {
  tasks.withType(app.cash.zipline.gradle.ZiplineCompileTask).toList().each { t ->
    t.signingKeys.set(providers.provider {
      def portalKey = new File(keliverPortalStore(project), 'keys/ed25519.priv')
      if (!portalKey.exists()) return []
      [new app.cash.zipline.gradle.ZiplineCompileTask.ManifestSigningKey(
        'portal-ed25519',
        app.cash.zipline.loader.SignatureAlgorithmId.Ed25519,
        okio.ByteString.decodeHex(portalKey.text.trim()))]
    })
  }
}

kotlin {
  js {
    outputModuleName = 'portal-published-guest'
    browser()
    binaries.executable()
  }

  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverTreehouse
        api libs.zipline
      }
    }
    jsMain {
      dependencies {
        api projects.keliverTreehouseGuest
        implementation projects.portalDeviceGuest          // HostApi / PortalPresenter interfaces
        implementation projects.keliverMaterialProtocolGuestWeb      // KeliverMaterialProtocolWidgetSystemFactory
        implementation projects.portalAppLib               // canonical screens/ + logic/ + PublishedEntry
        implementation projects.portalSql                  // M7: HostSqlDriver wire
        implementation libs.jetbrains.compose.runtime
        implementation libs.kotlinx.coroutines.core
      }
    }
  }
}
