// spike/keliver-web portal P4 — the PUBLISHED guest template. The publish step
// (portal-server POST /publish) writes generated/PublishedScreen.kt +
// PublishedEntry.kt into this module, compiles it to a .zipline bundle, and
// SIGNS the manifest with the portal's Ed25519 key from THIS repo's resolved
// document store (scripts/keliver-store-path.sh — the one store contract).
// Engineers own src/jsMain/kotlin/impl/ (bindings impls) — the round-trip
// boundary enforced at compile time. Service names match portal-device-guest,
// so the SAME host app loads either bundle (dev interpreter vs published).
apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'app.cash.zipline'

redwoodBuild {
  ziplineApplication('portal-published')
}


kotlin {
  js {
    outputModuleName = 'portal-published-guest'
    browser()
    binaries.executable()
  }

  sourceSets {
    commonMain {
      dependencies {
        api projects.keliverTreehouse
        api libs.zipline
      }
    }
    jsMain {
      dependencies {
        api projects.keliverTreehouseGuest
        implementation projects.portalDeviceGuest          // HostApi / PortalPresenter interfaces
        implementation projects.keliverMaterialProtocolGuestWeb      // KeliverMaterialProtocolWidgetSystemFactory
        implementation projects.portalAppLib               // canonical screens/ + logic/ + PublishedEntry
        implementation projects.portalSql                  // M7: HostSqlDriver wire
        implementation libs.jetbrains.compose.runtime
        implementation libs.kotlinx.coroutines.core
      }
    }
  }
}


// SIGNING IS WIRED BELOW `kotlin {}`, AND THE POSITION IS THE WHOLE POINT.
//
// Sign with the portal's key when it exists (generated by portal-server at
// first boot). Absent key (fresh checkout / CI) -> unsigned dev bundle.
//
// The store used to be hardcoded to ~/.keliver-portal. Once the relay moved to
// a per-app store, this module kept signing with the OLD global key while the
// hosts embedded whichever public key they found — a bundle signed by one
// identity and verified against another. All of them now ask the same resolver.
//
// This is the one consumer whose decision — sign, or ship unsigned — could not
// be made through the `zipline { signingKeys { ... } }` extension: a key is
// either IN that container or not, and membership is fixed while this file is
// read, so asking the resolver there made an unanswerable store fail every task
// in the build. The wiring goes one level down instead, onto the compile task's
// own ListProperty, and nothing queries it until a bundle is being compiled:
//
//   resolver answers + key present -> signed with THIS app's identity
//   resolver answers + no key      -> empty list, unsigned dev bundle
//   resolver cannot answer         -> the compile task fails, saying why
//
// The third case must not degrade to the second. "I could not find out whether
// you have a signing key" is not "you have no signing key".
//
// THE ORDERING RULE. The zipline plugin writes signingKeys from the compile
// task's REGISTRATION action, and those tasks are registered when the JS
// binaries are created — by `binaries.executable()` in the block above. Gradle
// splices a registration action into the container's action chain AT THE
// POSITION register() WAS CALLED: actions added before it run before it,
// actions added after it run after it and win. So this statement has to come
// after the `kotlin {}` block, and that is the only thing making it work.
//
// MEASURED in this build: the same statement ABOVE the kotlin block ->
// unsigned.signatures = {} with a key present; below it -> signed. Three
// explanations of why were written down before this one and each was wrong;
// two invoked afterEvaluate, which is not needed and hid the real rule. If you
// move this statement, re-run scripts/keliver-guest-signing-check.sh before
// believing it still works.
//
// FAIL CLOSED on there being nothing to wire: isEmpty() realizes the
// collection, so "the plugin registered no compile task" becomes a build
// failure rather than an unsigned bundle.
//
// NOT covered: a ZiplineCompileTask registered AFTER this statement would keep
// the plugin's value, because ours would again be the earlier action. Nothing
// registers one later today, and the check below is the backstop — though it
// builds the Development variant only.
def ziplineCompileTasks = tasks.withType(app.cash.zipline.gradle.ZiplineCompileTask)
if (ziplineCompileTasks.isEmpty()) {
  throw new GradleException('keliver: the zipline plugin registered no compile task for ' +
    'portal-published-guest, so there is nothing to attach this app\'s signing identity ' +
    'to. Refusing to build a bundle that would silently ship unsigned.')
}
ziplineCompileTasks.configureEach {
  signingKeys.set(providers.provider {
    def portalKey = new File(keliverPortalStore(project), 'keys/ed25519.priv')
    if (!portalKey.exists()) return []
    [new app.cash.zipline.gradle.ZiplineCompileTask.ManifestSigningKey(
      'portal-ed25519',
      app.cash.zipline.loader.SignatureAlgorithmId.Ed25519,
      okio.ByteString.decodeHex(portalKey.text.trim()))]
  })
}