// spike/keliver-web: a Compose-for-Web (JS canvas) app that renders keliver-material
// widgets in a browser using the SAME renderer code as Android/iOS — proving
// "one Kotlin codebase → web + Android + iOS". Not published; spike only.
apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.compose'

kotlin {
  wasmJs {
    browser {
      commonWebpackConfig {
        outputFileName = 'web-spike.js'
      }
    }
    binaries.executable()
  }
  sourceSets {
    wasmJsMain {
      dependencies {
        // Host side: protocol-host + ComposeUi renderers (canvas).
        implementation project(':keliver-material-composeui')  // host renderers + widget system
        implementation project(':keliver-material-protocol-host-web')     // KeliverMaterialHostProtocol
        implementation project(':keliver-protocol')            // protocol Change / ChangesSink
        implementation project(':keliver-protocol-host')       // HostProtocolAdapter + UiChange + UiEventSink
        implementation project(':keliver-widget-composeui')    // ComposeWidgetChildren (host root)
        implementation project(':keliver-leak-detector')       // LeakDetector.none()
        implementation project(':keliver-runtime')             // UiConfiguration, Dp
        // GATE 5 (Phase B): the GUEST now runs IN THE BROWSER (browser-side / fat client).
        implementation project(':keliver-protocol-guest')      // DefaultGuestProtocolAdapter + ProtocolRedwoodComposition
        implementation project(':keliver-material-protocol-guest-web')    // KeliverMaterialProtocolWidgetSystemFactory (guest)
        implementation project(':keliver-material-compose')    // guest @Composable widgets (StyledBox/StyledText/Button…)
        implementation project(':keliver-layout-compose')      // Column / Spacer guest composables
        implementation project(':portal-core')                 // WidgetNode model + sampleTree
        implementation project(':portal-render')               // GENERATED RenderNode interpreter (P1)
        implementation project(':portal-document')             // V2 M1: document + op client
        implementation project(':portal-app-lib')              // P3-12: the APP's real presenters (per-app preview build)
        implementation project(':portal-editor')               // item ②: reusable editor shell (runPortalEditor + preview caps)
        implementation libs.kotlinx.serialization.json
        implementation libs.kotlinx.coroutines.core           // delay() in the hot-reload watch loop
        implementation libs.jetbrains.compose.runtime
        implementation libs.jetbrains.compose.foundation
        implementation libs.jetbrains.compose.ui
        implementation libs.jetbrains.compose.material3
        implementation libs.coil.compose                       // ImageLoader for the widget system
        implementation libs.okio                               // Buffer/ImageSource for the network fetcher
        implementation libs.kotlinx.browser                    // window.fetch + typed arrays (browser-fetch Coil fetcher)
      }
    }
  }
}

// Which editor this is. The tools bundle ships this module's build as the
// GENERIC editor, which keliver-portal serves for any app without its own
// editor. Compiled component preview looks adapters up by component NAME, so
// the generic editor must carry none: with this repo's adapters it drew this
// repo's sample components in place of an app's opaque components that happen
// to share a name. build-portal-tools.sh passes -Pkeliver.genericEditor=true;
// the repo's own dev loop (the relay's preview build) passes nothing.
// Only true/false are accepted: a value that silently meant the other editor is
// how the device host's flag went wrong (see portal-device-android).
def genericEditorRaw = providers.gradleProperty('keliver.genericEditor').getOrElse('false').trim().toLowerCase()
if (!(genericEditorRaw in ['true', 'false'])) {
  throw new GradleException("keliver: -Pkeliver.genericEditor=${genericEditorRaw} is not true or false.")
}
kotlin.sourceSets.wasmJsMain.kotlin.srcDir(genericEditorRaw == 'true' ? 'src/genericEditor/kotlin' : 'src/repoEditor/kotlin')
