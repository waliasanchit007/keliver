// Platform-agnostic portal core: the WidgetNode tree model + Kotlin codegen.
// No keliver/Compose deps — pure Kotlin, consumed by the wasm engine (web-spike)
// and the jvm export verifier (web-spike-guest-compiler).
apply plugin: 'org.jetbrains.kotlin.multiplatform'

// Published: the portal tree model + catalog/exporter a consumer editor needs.
redwoodBuild {
  publishing()
}

kotlin {
  jvm()
  js {
    browser() // for the on-device Treehouse guest (Option X)
  }
  wasmJs {
    browser()
  }
  sourceSets {
    commonMain {
      dependencies {
        implementation libs.kotlinx.serialization.json // type-tagged tree (de)serialization (M2)
      }
    }
  }
}

// GeneratedCatalog.kt and GeneratedExporter.kt are written by :portal-schema-codegen:generatePortalCode
// and compared byte for byte by checkPortalCode: no spotless.
afterEvaluate {
  spotless {
    kotlin {
      targetExclude("src/**/GeneratedCatalog.kt", "src/**/GeneratedExporter.kt")
    }
  }
}
