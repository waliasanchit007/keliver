// spike/keliver-web portal M2 Option X — the Android Treehouse HOST. Loads the
// keliver-material guest bundle, binds HostApi (OkHttp GET of the relay), and mounts
// TreehouseContent with the published ComposeUiKeliverMaterialWidgetSystem renderers.
// Template: sample/host-android.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.compose'
apply plugin: 'app.cash.zipline' // IR plugin for zipline.take/bind

// ACCEPTED FORMS, and nothing else. Groovy's String.toBoolean() looks
// permissive and is not: MEASURED, '1' and 'y' are true while 'yes' and 'on'
// are FALSE, and a bare -Pkeliver.devOnlyHost (no '=') is the empty string,
// also false. So -Pkeliver.devOnlyHost=yes silently built a PRODUCTION-shaped
// host for someone who asked for the development-only one. Unsupported values
// are now rejected rather than quietly meaning the other mode.
//
//   true:  true 1 yes on      false: false 0 no off      (case-insensitive)
//
// A bare flag is rejected too: it plainly intends `true`, and guessing that is
// how this class of bug starts.
ext.keliverBooleanProperty = { String name ->
  def raw = project.findProperty(name)
  if (raw == null) return false
  def v = raw.toString().trim().toLowerCase()
  if (v in ['true', '1', 'yes', 'on']) return true
  if (v in ['false', '0', 'no', 'off']) return false
  throw new GradleException(
    "keliver: -P${name}=${raw} is not a value this build understands.\n" +
      '  true:  true 1 yes on\n' +
      '  false: false 0 no off\n' +
      (v.isEmpty()
        ? '  A bare -P' + name + ' has no value; write -P' + name + '=true.'
        : '  Refusing to guess: the wrong guess builds the other kind of host.'))
}
def devOnlyHost = keliverBooleanProperty('keliver.devOnlyHost')
// -Pkeliver.portalStore=<dir> overrides the resolved store. PORTAL_STORE is an
// ENV var and Groovy's List.execute() inherits the Gradle DAEMON's environment,
// not the invoking shell's, so an env var cannot be relied on to reach this
// code. The hygiene check needs a deterministic input; production resolution is
// unchanged when the property is absent.
def portalStoreOverride = project.findProperty('keliver.portalStore')
def portalStoreDir = portalStoreOverride ? new File(portalStoreOverride.toString())
                                         : keliverStoreDir(rootProject.projectDir)
def portalPubKey = new File(portalStoreDir, 'keys/ed25519.pub')
def embedPortalKey = !devOnlyHost && portalPubKey.exists()

android {
  namespace 'dev.keliver.portaldevice.host'

  defaultConfig {
    applicationId 'dev.keliver.portaldevice'
    versionCode 1
    versionName '1.0'
    // Read by HostTrustPolicy. The generic tools host sets this; an adopter's
    // own production host leaves it false.
    buildConfigField 'boolean', 'DEV_ONLY', devOnlyHost.toString()
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  sourceSets {
    main {
      assets.srcDirs += "$buildDir/portalKeys"
    }
  }
}

// P4/U22: prod mode verifies signed manifests against the portal's Ed25519
// PUBLIC key, embedded at build time. TWO different binaries come out of this
// module and they must not be confused:
//
//   * -Pkeliver.devOnlyHost=true -> the GENERIC DEVELOPMENT HOST shipped in
//     keliver-portal-tools. No key is embedded, BuildConfig.DEV_ONLY is true,
//     and the host refuses prod mode outright. It belongs to nobody, so there
//     is no identity it could verify a production bundle against.
//   * default -> an APP-SPECIFIC PRODUCTION HOST, built by an adopter on a
//     machine whose portal store holds keys/ed25519.pub. That key is embedded
//     and signature verification stays on.
//
// This used to depend on whether the build machine happened to have a store:
// the tools bundle built locally embedded ITS BUILDER'S key, which would ship
// one developer's portal identity in a public artifact and make verification
// fail for every adopter signing with their own. It is now an explicit build
// input, not an accident of the filesystem.

// Sync, not Copy: Copy with onlyIf left a previously copied key sitting in the
// output directory when the input later disappeared, so a warm build directory
// could smuggle an earlier build's key into a later APK. Sync makes the
// directory match the inputs exactly, which for the dev-only host means empty.
tasks.register('syncPortalKey', Sync) {
  into "$buildDir/portalKeys"
  if (embedPortalKey) {
    from(portalPubKey) { rename { 'portal_ed25519.pub' } }
  }
  doFirst {
    logger.lifecycle(embedPortalKey
      ? "portal-device-android: embedding portal key from ${portalPubKey}"
      : "portal-device-android: DEVELOPMENT-ONLY host — no portal key embedded" +
        (devOnlyHost ? " (keliver.devOnlyHost=true)" : " (no key at ${portalPubKey})"))
  }
}
preBuild.dependsOn syncPortalKey

dependencies {
  implementation projects.keliverTreehouseHost           // TreehouseAppFactory, Spec, MemoryStateStore
  implementation projects.keliverTreehouseHostComposeui  // TreehouseContent
  implementation projects.keliverMaterialComposeui       // ComposeUiKeliverMaterialWidgetSystem
  implementation projects.keliverMaterialProtocolHostWeb           // KeliverMaterialHostProtocol
  implementation projects.portalDeviceGuest              // HostApi / PortalPresenter interfaces
  implementation projects.portalSql                      // M7: HostSqlDriver wire (AndroidSqlHost)
  implementation projects.keliverHttp                    // #16 H1: generic HostHttpProvider
  implementation libs.zipline
  implementation libs.zipline.loader                     // ManifestVerifier, asZiplineHttpClient
  implementation libs.okhttp
  implementation libs.androidx.activity.compose
  implementation libs.androidx.core
  implementation libs.coil.compose                       // ImageLoader
  implementation libs.coil.network.okhttp                // network images on Android
  implementation libs.jetbrains.compose.runtime
  implementation libs.jetbrains.compose.foundation
  implementation libs.jetbrains.compose.material
  implementation libs.jetbrains.compose.ui
  implementation libs.kotlinx.coroutines.core
  testImplementation libs.kotlin.test
  testImplementation libs.kotlin.test.junit
  testImplementation libs.junit
}
